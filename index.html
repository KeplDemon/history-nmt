<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Вся історія на НМТ</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 30, 46, 0.85);
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --timeline-line: #475569;
            --font-size-base: 15px;
            --node-gap: 180px;
        }

        body.light-theme {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --timeline-line: #cbd5e1;
        }

        body.sepia-theme {
            --bg-color: #fbf0d9;
            --panel-bg: rgba(243, 229, 171, 0.9);
            --card-bg: #fff8e7;
            --card-border: #d7c4b0;
            --text-main: #433422;
            --text-muted: #7f6a54;
            --accent: #b45309;
            --accent-glow: rgba(180, 83, 9, 0.2);
            --timeline-line: #d7c4b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: var(--font-size-base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ХЕДЕР И ШАПКА */
        header {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            padding: 0.8rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            outline: none;
            width: 220px;
            font-size: 0.85rem;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--card-bg);
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            display: none;
            width: 100%;
            height: 100%;
        }

        .view-section.active {
            display: block;
        }

        /* ИНТЕРАКТИВНАЯ ШКАЛА */
        .timeline-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 100px 50px 150px 50px;
            position: relative;
            min-height: calc(100vh - 60px);
            cursor: grab;
        }

        .timeline-wrapper.vertical {
            overflow-x: hidden;
            overflow-y: auto;
            padding: 50px 20px;
        }

        .timeline-container {
            position: relative;
            min-width: max-content;
        }

        /* Главная ось */
        .timeline-axis {
            position: absolute;
            background-color: var(--timeline-line);
            border-radius: 2px;
        }

        .timeline-wrapper:not(.vertical) .timeline-axis {
            height: 4px;
            top: 120px;
            left: 0;
            right: 0;
        }

        .timeline-wrapper.vertical .timeline-axis {
            width: 4px;
            left: 100px;
            top: 0;
            bottom: 0;
        }

        /* Периоды (полоски над шкалой) */
        .period-bar {
            position: absolute;
            height: 12px;
            border-radius: 6px;
            top: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            white-space: nowrap;
            padding: 0 8px;
        }

        /* Узлы/Точки событий */
        .timeline-node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transform: translateX(-50%);
            transition: transform 0.2s;
        }

        .timeline-wrapper:not(.vertical) .timeline-node {
            top: 110px;
        }

        .timeline-node:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .node-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--accent);
            border: 4px solid var(--bg-color);
            box-shadow: 0 0 10px var(--accent-glow);
            z-index: 2;
        }

        .timeline-node.active .node-dot {
            background-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
        }

        .node-label {
            margin-top: 10px;
            text-align: center;
            max-width: 140px;
            pointer-events: none;
        }

        .node-date {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--accent);
        }

        .node-title {
            font-size: 0.8rem;
            color: var(--text-main);
            margin-top: 2px;
            line-height: 1.2;
        }

        /* МОДАЛЬНОЕ ОКНО (КОНСПЕКТ) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 1.2rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-date {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            margin-top: 2px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 0 0.4rem;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.2rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Картинки в конспекте */
        .modal-images {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .modal-img-wrapper {
            width: 100%;
            text-align: center;
        }

        .modal-img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            object-fit: contain;
            border: 1px solid var(--card-border);
        }

        .modal-img-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }

        /* Текстовая верстка конспекта */
        .full-text {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .full-text p { margin-bottom: 0.6rem; }
        .full-text ul { padding-left: 1.2rem; margin-bottom: 0.6rem; }
        .full-text li { margin-bottom: 0.3rem; }

        /* Термины (Теги) */
        .terms-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .term-badge {
            background: var(--panel-bg);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* Спойлеры / Аккордеоны (<details>) */
        details {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        summary {
            padding: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            outline: none;
            color: var(--text-main);
        }

        summary:hover {
            background: rgba(255,255,255,0.03);
        }

        .accordion-content {
            padding: 0.8rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        /* НАСТРОЙКИ */
        .settings-panel {
            max-width: 500px;
            margin: 3rem auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--card-border);
        }

        .setting-row:last-child { border-bottom: none; }

        select, input[type="range"] {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>📖</span> Вся історія на НМТ
        </div>
        <div class="nav-group">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук події чи дати..." oninput="handleSearch()">
            <button class="nav-btn active" onclick="switchTab('timeline')">Шкала</button>
            <button class="nav-btn" onclick="switchTab('settings')">⚙️ Налаштування</button>
        </div>
    </header>

    <main>
        <div id="timeline-view" class="view-section active">
            <div class="timeline-wrapper" id="timelineWrapper">
                <div class="timeline-container" id="timelineContainer">
                    <div class="timeline-axis" id="timelineAxis"></div>
                    <div id="periodsLayer"></div>
                    <div id="nodesLayer"></div>
                </div>
            </div>
        </div>

        <div id="settings-view" class="view-section">
            <div class="settings-panel">
                <h2 style="margin-bottom: 1rem;">⚙️ Налаштування</h2>
                
                <div class="setting-row">
                    <span>Тема оформлення:</span>
                    <select id="themeSelect" onchange="changeTheme(this.value)">
                        <option value="dark">Темна</option>
                        <option value="light">Світла</option>
                        <option value="sepia">Сепія</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span>Орієнтація шкали:</span>
                    <select id="orientationSelect" onchange="changeOrientation(this.value)">
                        <option value="horizontal">Горизонтальна</option>
                        <option value="vertical">Вертикальна</option>
                    </select>
                </div>

                <div class="setting-row">
                    <span>Відстань між точками:</span>
                    <select id="spacingSelect" onchange="changeSpacing(this.value)">
                        <option value="fixed">Рівномірна (Широка)</option>
                        <option value="dynamic">Динамічна (по роках)</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalTitle">Назва події</div>
                    <div class="modal-date" id="modalDate">Дата</div>
                </div>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                </div>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        // Месяцы для авто-форматирования дат
        const MONTHS_UA = [
            "січня", "лютого", "березня", "квітня", "травня", "червня",
            "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"
        ];

        let activeEventId = null;
        let spacingMode = 'fixed'; // 'fixed' или 'dynamic'
        let orientation = 'horizontal';

        // --- 1. ПАРСИНГ И ОБРАБОТКА ДАТ --- //

        // Превращает любую дату в числовой год для расчёта координат
        function parseToYearNumber(dateVal) {
            if (typeof dateVal === 'number') return dateVal;
            if (!dateVal) return 0;

            const str = String(dateVal).trim();
            const parts = str.split('.');

            if (parts.length === 3) {
                // Формат "06.12.1240"
                return parseFloat(parts[2]) + (parseFloat(parts[1]) / 12);
            } else if (parts.length === 2) {
                // Формат "06.1991"
                return parseFloat(parts[1]) + (parseFloat(parts[0]) / 12);
            } else {
                // Формат "1240"
                return parseFloat(str) || 0;
            }
        }

        // Авто-генератор yearText если он отсутствует в data.js
        function getFormattedYearText(item) {
            if (item.yearText) return item.yearText;

            const raw = item.date;
            if (typeof raw === 'number') {
                if (raw < 0) {
                    const abs = Math.abs(raw);
                    if (abs >= 1000000) return `${abs / 1000000} млн р. тому`;
                    if (abs >= 1000) return `${abs / 1000} тис. р. тому`;
                    return `${abs} р. до н.е.`;
                }
                return `${raw} р.`;
            }

            const str = String(raw).trim();
            const parts = str.split('.');

            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = MONTHS_UA[parseInt(parts[1], 10) - 1] || '';
                return `${day} ${month} ${parts[2]} р.`;
            } else if (parts.length === 2) {
                const month = MONTHS_UA[parseInt(parts[0], 10) - 1] || '';
                return `${month} ${parts[1]} р.`;
            }

            return `${str} р.`;
        }

        // --- 2. РЕНДЕР ШКАЛЫ И СОБЫТИЙ --- //

        function renderTimeline() {
            if (typeof eventsData === 'undefined') return;

            const container = document.getElementById('timelineContainer');
            const nodesLayer = document.getElementById('nodesLayer');
            const periodsLayer = document.getElementById('periodsLayer');
            const axis = document.getElementById('timelineAxis');

            nodesLayer.innerHTML = '';
            periodsLayer.innerHTML = '';

            // Сортируем события по времени
            const sortedEvents = [...eventsData].sort((a, b) => parseToYearNumber(a.date) - parseToYearNumber(b.date));

            let totalLength = 0;
            const nodePositions = {};

            // Расчёт позиций
            const baseGap = 180;
            sortedEvents.forEach((ev, index) => {
                let pos = 0;
                if (spacingMode === 'fixed') {
                    pos = 50 + index * baseGap;
                } else {
                    // Динамический расчёт
                    if (index === 0) pos = 50;
                    else {
                        const prevYear = parseToYearNumber(sortedEvents[index - 1].date);
                        const currYear = parseToYearNumber(ev.date);
                        const diff = Math.max(1, currYear - prevYear);
                        // Логарифмическое сжатие для древних эпох
                        const step = Math.min(400, Math.max(120, Math.log10(diff + 1) * 100));
                        pos = nodePositions[sortedEvents[index - 1].id] + step;
                    }
                }
                nodePositions[ev.id] = pos;
                totalLength = pos + 150;
            });

            // Устанавливаем размер оси
            if (orientation === 'horizontal') {
                container.style.width = `${totalLength}px`;
                container.style.height = '300px';
                axis.style.width = `${totalLength}px`;
            }

            // Отрисовка точек событий
            sortedEvents.forEach(ev => {
                const pos = nodePositions[ev.id];
                const node = document.createElement('div');
                node.className = `timeline-node ${activeEventId === ev.id ? 'active' : ''}`;
                node.id = `node-${ev.id}`;
                node.style.left = `${pos}px`;

                const dateText = getFormattedYearText(ev);

                node.innerHTML = `
                    <div class="node-dot"></div>
                    <div class="node-label">
                        <div class="node-date">${dateText}</div>
                        <div class="node-title">${ev.title}</div>
                    </div>
                `;

                node.onclick = () => toggleEventModal(ev);
                nodesLayer.appendChild(node);
            });

            // Отрисовка полосок периодов (periodsData)
            if (typeof periodsData !== 'undefined') {
                periodsData.forEach(period => {
                    const startPos = nodePositions[period.startEventId];
                    const endPos = nodePositions[period.endEventId];

                    if (startPos !== undefined && endPos !== undefined) {
                        const bar = document.createElement('div');
                        bar.className = 'period-bar';
                        bar.style.left = `${startPos}px`;
                        bar.style.width = `${endPos - startPos}px`;
                        bar.style.backgroundColor = period.color || '#3b82f6';
                        bar.innerText = period.title;
                        bar.title = period.description || '';
                        periodsLayer.appendChild(bar);
                    }
                });
            }
        }

        // --- 3. МОДАЛЬНОЕ ОКНО КОНСПЕКТА --- //

        function toggleEventModal(ev) {
            if (activeEventId === ev.id) {
                closeModal();
                return;
            }

            activeEventId = ev.id;
            document.querySelectorAll('.timeline-node').forEach(n => n.classList.remove('active'));
            const activeNode = document.getElementById(`node-${ev.id}`);
            if (activeNode) activeNode.classList.add('active');

            document.getElementById('modalTitle').innerText = ev.title;
            document.getElementById('modalDate').innerText = getFormattedYearText(ev);

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            // Галерея картинок
            if (ev.images && ev.images.length > 0) {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'modal-images';
                ev.images.forEach(img => {
                    imgContainer.innerHTML += `
                        <div class="modal-img-wrapper">
                            <img src="${img.url}" class="modal-img" alt="${img.caption || ''}">
                            ${img.caption ? `<div class="modal-img-caption">${img.caption}</div>` : ''}
                        </div>
                    `;
                });
                body.appendChild(imgContainer);
            }

            // Основной конспект
            if (ev.details && ev.details.fullText) {
                const fullTextDiv = document.createElement('div');
                fullTextDiv.className = 'full-text';
                fullTextDiv.innerHTML = ev.details.fullText;
                body.appendChild(fullTextDiv);
            }

            // Термины
            if (ev.details && ev.details.terms && ev.details.terms.length > 0) {
                const termsDiv = document.createElement('div');
                termsDiv.className = 'terms-container';
                ev.details.terms.forEach(term => {
                    termsDiv.innerHTML += `<span class="term-badge"># ${term}</span>`;
                });
                body.appendChild(termsDiv);
            }

            // Раскрывающиеся аккордеоны (<details>)
            if (ev.details && ev.details.accordions && ev.details.accordions.length > 0) {
                ev.details.accordions.forEach(acc => {
                    const det = document.createElement('details');
                    det.innerHTML = `
                        <summary>${acc.title}</summary>
                        <div class="accordion-content">${acc.content}</div>
                    `;
                    body.appendChild(det);
                });
            }

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.querySelectorAll('.timeline-node').forEach(n => n.classList.remove('active'));
            activeEventId = null;
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'modalOverlay') closeModal();
        }

        // --- 4. НАВИГАЦИЯ И НАСТРОЙКИ --- //

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            if (tab === 'timeline') {
                document.getElementById('timeline-view').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('settings-view').classList.add('active');
                event.target.classList.add('active');
            }
        }

        function changeTheme(theme) {
            document.body.className = theme === 'dark' ? '' : `${theme}-theme`;
        }

        function changeSpacing(mode) {
            spacingMode = mode;
            renderTimeline();
        }

        function changeOrientation(orient) {
            orientation = orient;
            const wrapper = document.getElementById('timelineWrapper');
            if (orient === 'vertical') wrapper.classList.add('vertical');
            else wrapper.classList.remove('vertical');
            renderTimeline();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) return;

            const match = eventsData.find(ev => 
                ev.title.toLowerCase().includes(query) || 
                (ev.yearText && ev.yearText.toLowerCase().includes(query)) ||
                String(ev.date).includes(query)
            );

            if (match) {
                const node = document.getElementById(`node-${match.id}`);
                if (node) {
                    node.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'center' });
                    toggleEventModal(match);
                }
            }
        }

        // Запуск при загрузке страницы
        window.onload = () => {
            renderTimeline();
        };
    </script>
</body>
</html>

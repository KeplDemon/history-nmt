<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPrep NMT | Інтерактивна платформа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #151c2c;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26334d;
      --bubble-bg: #1e293b;
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --bubble-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Шапка */
    .header-container {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.1rem; }
    .logo span { color: var(--accent-gold); }

    .settings-trigger-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
    }

    .nav-links { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 600; padding: 0.3rem 0.6rem;
      border-radius: 6px; white-space: nowrap; cursor: pointer;
    }
    .nav-btn.active { color: var(--text-main); background-color: var(--border-color); }

    .search-box input {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.85rem; outline: none;
    }

    /* Таймлайн контейнер */
    .timeline-container { position: relative; width: 100%; margin-top: 1rem; overflow: hidden; }

    .timeline-scroll-area {
      display: flex; overflow-x: auto; position: relative; padding: 3.5rem 1rem;
      width: 100%; cursor: grab; user-select: none; scrollbar-width: none;
    }
    .timeline-scroll-area::-webkit-scrollbar { display: none; }
    .timeline-scroll-area:active { cursor: grabbing; }

    .timeline-scroll-area.horizontal { min-width: 100%; }

    /* Золотая линия аккуратно заканчивается перед стрелкой */
    .timeline-scroll-area.horizontal .timeline-axis-line {
      position: absolute; top: 50%; left: 0; right: 1.5rem;
      height: 3px; background-color: var(--accent-gold); z-index: 1;
    }

    .timeline-scroll-area.horizontal .timeline-ticks {
      display: flex; position: relative; z-index: 2; align-items: center;
      width: max-content; padding-right: 4rem;
    }

    /* Стрелка аккуратная без рамок */
    .fixed-arrow-right {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      font-size: 0.9rem; color: var(--accent-gold); z-index: 10;
      pointer-events: none; background: transparent; padding: 0; border: none;
    }

    /* Элемент точки */
    .tick-wrapper { display: flex; align-items: center; }

    .tick-item {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; min-width: 120px; text-align: center;
    }

    .tick-mark {
      width: 16px; height: 16px; background: var(--accent-gold);
      border-radius: 50%; border: 3px solid var(--bg-color); margin: 6px 0;
      transition: transform 0.2s, background-color 0.2s;
    }

    .tick-item:hover .tick-mark, .tick-item.active .tick-mark {
      transform: scale(1.4); background: var(--accent-blue);
    }

    .tick-year { font-weight: 800; font-size: 0.85rem; color: var(--accent-gold); }
    .tick-short-title { font-size: 0.8rem; color: var(--text-muted); max-width: 130px; line-height: 1.2; }

    /* Значок разрыва времени для больших эпох */
    .time-gap-break {
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-gold); font-weight: bold; font-size: 1.2rem;
      padding: 0 10px; opacity: 0.6; user-select: none;
    }

    /* Карточка-конспект */
    .speech-bubble {
      position: relative; margin: 1rem; background: var(--bubble-bg);
      border: 2px solid var(--accent-blue); border-radius: 14px; padding: 1.4rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .speech-bubble.hidden { display: none !important; }

    .bubble-close {
      position: absolute; top: 10px; right: 14px; font-size: 1.6rem;
      background: none; border: none; color: var(--text-muted); cursor: pointer;
    }

    .bubble-year { color: var(--accent-gold); font-weight: 900; font-size: 1.15rem; margin-bottom: 4px; display: inline-block; }
    .bubble-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .bubble-body { margin-top: 1rem; font-size: 0.95rem; line-height: 1.6; color: var(--text-main); }
    .bubble-terms { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); font-size: 0.85rem; color: var(--accent-gold); }

    /* Спойлеры */
    .accordion-container { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .accordion-item { border: 1px solid var(--border-color); border-radius: 8px; background: var(--panel-bg); overflow: hidden; }
    .accordion-header { padding: 0.7rem 1rem; font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .accordion-header::after { content: '▼'; font-size: 0.7rem; }
    .accordion-content { display: none; padding: 0.8rem 1rem; border-top: 1px solid var(--border-color); background: var(--bg-color); font-size: 0.85rem; line-height: 1.4; }
    .accordion-item.open .accordion-content { display: block; }
    .accordion-content img { max-width: 100%; border-radius: 8px; margin-top: 0.5rem; border: 1px solid var(--border-color); }

    /* Модалка */
    .modal-wrapper { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; }
    .modal-wrapper.open { display: block !important; }
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
    .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.2rem; width: 90%; max-width: 380px; z-index: 1001; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: none; border: none; font-size: 1.4rem; color: var(--text-main); cursor: pointer; }
    .setting-item { margin-bottom: 1.2rem; }
    .setting-item label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .toggle-group { display: flex; gap: 0.5rem; }
    .btn-toggle { flex: 1; padding: 0.5rem 0.3rem; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; cursor: pointer; font-size: 0.75rem; text-align: center; }
    .btn-toggle.active { background: var(--accent-blue); border-color: var(--accent-blue); }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-row">
      <div class="logo">EduPrep <span>НМТ</span></div>
      <button id="open-settings-btn" class="settings-trigger-btn">⚙ Налаштування</button>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active">Історія України</button>
      <button class="nav-btn">Діячі</button>
      <button class="nav-btn">Пам'ятки</button>
      <button class="nav-btn">Шпори</button>
    </nav>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Пошук року, події чи терміну...">
    </div>
  </header>

  <main>
    <div class="timeline-container">
      <div class="fixed-arrow-right" id="main-arrow">►</div>
      <div class="timeline-scroll-area horizontal" id="scroll-area">
        <div class="timeline-axis-line"></div>
        <div class="timeline-ticks" id="timeline-ticks"></div>
      </div>
    </div>

    <div id="details-bubble" class="speech-bubble hidden">
      <button class="bubble-close" id="close-bubble">&times;</button>
      <div class="bubble-header">
        <span class="bubble-year" id="det-year"></span>
        <h3 id="det-title"></h3>
      </div>
      <div class="bubble-body" id="det-body"></div>
      <div class="accordion-container" id="det-accordions"></div>
      <div class="bubble-terms" id="det-terms"></div>
    </div>
  </main>

  <div id="settings-modal" class="modal-wrapper">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Налаштування</h3>
        <button id="close-settings-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label>Тема оформлення:</label>
          <div class="toggle-group">
            <button id="btn-theme-dark" class="btn-toggle active">Темна</button>
            <button id="btn-theme-light" class="btn-toggle">Світла</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var currentActiveId = null;

    // gapType: 'huge' (века/тысячелетия), 'medium' (годы), 'small' (месяцы)
    var eventsData = [
      {
        id: "1",
        year: "1 млн р. тому",
        title: "Перші люди (Королеве)",
        gapType: "huge",
        details: {
          fullText: "<b>Палеоліт (Кам'яний вік).</b> Поява першої людини на території України.<br>Найдавніша стоянка — <b>с. Королеве (Закарпаття)</b>.<br>Інші стоянки: Мізин, Кирилівка, Межиріч, Киїк-Коба.",
          terms: ["Палеоліт", "Привласнювальне господарство", "Стоянка", "Антропогенез"],
          accordions: [
            {
              title: "🗺 Палеолітичні стоянки України",
              content: "📍 <b>Королеве</b> — найдавніша стоянка (1 млн років тому)<br>📍 <b>Мізин</b> — браслет з меандровим орнаментом, житла з кісток мамонта<br>📍 <b>Кирилівка</b> — стоянка в Києві"
            }
          ]
        }
      },
      {
        id: "2",
        year: "IV - III тис. до н.е.",
        title: "Трипільська культура",
        gapType: "huge",
        details: {
          fullText: "<b>Енеоліт (Мідно-кам'яний вік).</b> Расцвет відтворювального господарства (землеробство та скотарство).<br>Відкрита <b>Вікентієм Хвойкою</b> у 1893-1896 рр. поблизу с. Трипілля.",
          terms: ["Енеоліт", "Відтворювальне господарство", "Протоміста", "Мальована кераміка"],
          accordions: [
            {
              title: "🏺 Особливості трипільців",
              content: "• Будували двоповерхові будинки та великі протоміста (Майданецьке, Тальянки)<br>• Орнаментований керамічний посуд (спіралі, зображення змій)<br>• Через виснаження землі кожні 50-80 років спалювали свої поселення"
            }
          ]
        }
      },
      {
        id: "3",
        year: "VIII - VI ст. до н.е.",
        title: "Велика грецька колонізація",
        gapType: "medium",
        details: {
          fullText: "Заснування перших античних міст-держав на Північному Причорномор'ї: <b>Тіра, Ольвія, Херсонес, Пантікапей</b>.",
          terms: ["Метрополія", "Колонія", "Поліс"],
          accordions: [
            {
              title: "🏛 Грецькі міста-колонії",
              content: "📍 <b>Тіра</b> — сучасний Білгород-Дністровський<br>📍 <b>Ольвія</b> — поблизу Миколаєва<br>📍 <b>Херсонес</b> — Севастополь<br>📍 <b>Пантікапей</b> — Керч"
            }
          ]
        }
      },
      {
        id: "4",
        year: "VII - III ст. до н.е.",
        title: "Велика Скіфія",
        gapType: "medium",
        details: {
          fullText: "Могутня держава кочовиків-скіфів. Розквіт при князі Атеї. Соціальне розшарування (Кургани).",
          terms: ["Курган", "Пектораль", "Звіриний стиль", "Атей"],
          accordions: [
            {
              title: "🏆 Шедеври скіфської культури",
              content: "<b>Золота Пектораль</b> з кургану Товста Могила (знайдена Б. Мозолевським у 1971 р.).<br><b>Золотий гребінь</b> з кургану Солоха."
            }
          ]
        }
      },
      {
        id: "5",
        year: "860 р.",
        title: "Похід Аскольда на Царгород",
        gapType: "medium",
        details: {
          fullText: "Перший морський похід київського князя Аскольда на Візантію. Укладено першу русько-візантійську угоду.",
          terms: ["Аскольд", "Візантія", "Християнізація"],
          accordions: []
        }
      },
      {
        id: "6",
        year: "882 р.",
        title: "Об'єднання Києва та Новгорода",
        gapType: "small",
        details: {
          fullText: "Князь <b>Олег</b> вбиває Аскольда, захоплює Київ і проголошує його «матір'ю міст руських». Утворення Русі-України.",
          terms: ["Князь Олег", "Полюддя", "Київська Русь"],
          accordions: []
        }
      }
    ];

    function renderTimeline(data) {
      var container = document.getElementById('timeline-ticks');
      if (!container) return;
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #94a3b8;">Подій не знайдено</div>';
        return;
      }

      for (var i = 0; i < data.length; i++) {
        (function(item) {
          var wrapper = document.createElement('div');
          wrapper.className = 'tick-wrapper';

          // Динамический отступ в зависимости от эпохи
          var marginValue = '40px';
          if (item.gapType === 'huge') marginValue = '140px';
          else if (item.gapType === 'medium') marginValue = '80px';
          else if (item.gapType === 'small') marginValue = '35px';

          var tick = document.createElement('div');
          tick.className = 'tick-item' + (currentActiveId === item.id ? ' active' : '');
          tick.style.marginRight = marginValue;
          tick.innerHTML = 
            '<div class="tick-year">' + item.year + '</div>' +
            '<div class="tick-mark"></div>' +
            '<div class="tick-short-title">' + item.title + '</div>';
          
          tick.onclick = function() {
            if (currentActiveId === item.id) {
              closeBubble();
            } else {
              var allTicks = document.querySelectorAll('.tick-item');
              for (var j = 0; j < allTicks.length; j++) {
                allTicks[j].classList.remove('active');
              }
              tick.classList.add('active');
              currentActiveId = item.id;
              openBubble(item);
            }
          };

          wrapper.appendChild(tick);

          // Если разрыв огромен — добавляем визуальный разделитель «~»
          if (item.gapType === 'huge' && i < data.length - 1) {
            var gapMark = document.createElement('div');
            gapMark.className = 'time-gap-break';
            gapMark.innerText = '≈';
            gapMark.style.marginRight = marginValue;
            wrapper.appendChild(gapMark);
          }

          container.appendChild(wrapper);
        })(data[i]);
      }
    }

    function openBubble(item) {
      var bubble = document.getElementById('details-bubble');
      document.getElementById('det-year').innerText = item.year;
      document.getElementById('det-title').innerText = item.title;
      document.getElementById('det-body').innerHTML = item.details.fullText;
      
      var accContainer = document.getElementById('det-accordions');
      accContainer.innerHTML = '';

      if (item.details.accordions && item.details.accordions.length > 0) {
        for (var i = 0; i < item.details.accordions.length; i++) {
          (function(acc) {
            var accItem = document.createElement('div');
            accItem.className = 'accordion-item';
            accItem.innerHTML = 
              '<div class="accordion-header">' + acc.title + '</div>' +
              '<div class="accordion-content">' + acc.content + '</div>';
            
            accItem.querySelector('.accordion-header').onclick = function() {
              accItem.classList.toggle('open');
            };

            accContainer.appendChild(accItem);
          })(item.details.accordions[i]);
        }
      }

      var termsBox = document.getElementById('det-terms');
      if (item.details.terms && item.details.terms.length > 0) {
        termsBox.innerHTML = '<b>Терміни НМТ:</b> ' + item.details.terms.join(' • ');
        termsBox.style.display = 'block';
      } else {
        termsBox.style.display = 'none';
      }
      
      bubble.classList.remove('hidden');
    }

    function closeBubble() {
      document.getElementById('details-bubble').classList.add('hidden');
      var allTicks = document.querySelectorAll('.tick-item');
      for (var j = 0; j < allTicks.length; j++) {
        allTicks[j].classList.remove('active');
      }
      currentActiveId = null;
    }

    // Перетаскивание мышкой
    var scrollArea = document.getElementById('scroll-area');
    var isDown = false, startX, scrollLeft;

    scrollArea.addEventListener('mousedown', function(e) {
      isDown = true;
      startX = e.pageX - scrollArea.offsetLeft;
      scrollLeft = scrollArea.scrollLeft;
    });
    scrollArea.addEventListener('mouseleave', function() { isDown = false; });
    scrollArea.addEventListener('mouseup', function() { isDown = false; });
    scrollArea.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      e.preventDefault();
      var x = e.pageX - scrollArea.offsetLeft;
      scrollArea.scrollLeft = scrollLeft - (x - startX) * 1.5;
    });

    renderTimeline(eventsData);

    document.getElementById('close-bubble').onclick = closeBubble;
    document.getElementById('search-input').oninput = function(e) {
      var val = e.target.value.toLowerCase().trim();
      var filtered = [];
      for (var i = 0; i < eventsData.length; i++) {
        var item = eventsData[i];
        if (item.year.toLowerCase().indexOf(val) !== -1 || 
            item.title.toLowerCase().indexOf(val) !== -1 ||
            item.details.fullText.toLowerCase().indexOf(val) !== -1) {
          filtered.push(item);
        }
      }
      renderTimeline(filtered);
    };

    var modal = document.getElementById('settings-modal');
    document.getElementById('open-settings-btn').onclick = function() { modal.classList.add('open'); };
    document.getElementById('close-settings-btn').onclick = function() { modal.classList.remove('open'); };
    document.getElementById('modal-overlay').onclick = function() { modal.classList.remove('open'); };

    document.getElementById('btn-theme-light').onclick = function() {
      document.body.classList.add('light-theme');
      this.classList.add('active');
      document.getElementById('btn-theme-dark').classList.remove('active');
    };
    document.getElementById('btn-theme-dark').onclick = function() {
      document.body.classList.remove('light-theme');
      this.classList.add('active');
      document.getElementById('btn-theme-light').classList.remove('active');
    };
  </script>
</body>
</html>

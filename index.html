<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Вся історія на НМТ</title>
    <style>
        :root {
            /* Оригинальная тёмная графитовая палитра без холодного синего */
            --bg-main: #0d0e12;
            --panel-bg: #15161d;
            --card-bg: #1c1d26;
            --card-border: #2a2b38;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.15);
            --timeline-line: #374151;
            --font-size: 15px;
        }

        body.light-theme {
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --card-bg: #f9fafb;
            --card-border: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --accent: #4f46e5;
            --timeline-line: #d1d5db;
        }

        body.sepia-theme {
            --bg-main: #f4ecd8;
            --panel-bg: #e2d7be;
            --card-bg: #ebd2b9;
            --card-border: #d3c0a2;
            --text-primary: #423223;
            --text-secondary: #6e5944;
            --accent: #b45309;
            --timeline-line: #c8b69e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-size: var(--font-size);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- ШАПКА / ТИТУЛКА --- */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 220px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        /* --- ОСНОВНАЯ ОБЛАСТЬ --- */
        main {
            flex: 1;
            position: relative;
        }

        .tab-page {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-page.active {
            display: block;
        }

        /* --- ХРОНОЛОГИЧЕСКАЯ ШКАЛА --- */
        .timeline-viewport {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 90px 40px 140px 40px;
            position: relative;
            min-height: calc(100vh - 65px);
            user-select: none;
        }

        .timeline-canvas {
            position: relative;
            min-width: max-content;
        }

        .timeline-line {
            position: absolute;
            background-color: var(--timeline-line);
            height: 3px;
            top: 100px;
            left: 0;
            right: 0;
            border-radius: 2px;
        }

        /* Полосы периодов (над шкалой) */
        .period-segment {
            position: absolute;
            height: 14px;
            top: 70px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #ffffff;
            padding: 0 10px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 1;
        }

        /* Точка события на шкале */
        .event-node {
            position: absolute;
            top: 91px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.15s ease;
        }

        .event-node:hover {
            transform: translateX(-50%) scale(1.12);
        }

        .node-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--accent);
            border: 4px solid var(--bg-main);
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
            transition: all 0.2s;
        }

        .event-node.selected .node-circle {
            background-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            transform: scale(1.2);
        }

        .node-info {
            margin-top: 10px;
            text-align: center;
            width: 140px;
            pointer-events: none;
        }

        .node-year {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
        }

        .node-heading {
            font-size: 0.78rem;
            color: var(--text-primary);
            margin-top: 3px;
            line-height: 1.25;
            font-weight: 500;
        }

        /* --- МОДАЛЬНОЕ ОКНО (КОНСПЕКТ) --- */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-window {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            width: 100%;
            max-width: 620px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: popIn 0.2s ease-out;
            overflow: hidden;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-top {
            padding: 1.2rem 1.4rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: var(--panel-bg);
        }

        .modal-title-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .modal-date-text {
            font-size: 0.88rem;
            color: var(--accent);
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0 0.3rem;
            line-height: 1;
        }

        .btn-close:hover {
            color: var(--text-primary);
        }

        .modal-content {
            padding: 1.4rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Галерея изображений */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1.2rem;
        }

        .gallery-item {
            text-align: center;
        }

        .gallery-img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            object-fit: contain;
        }

        .gallery-caption {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 5px;
            font-style: italic;
        }

        /* Верстка текста конспекта */
        .text-body {
            line-height: 1.6;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }

        .text-body p { margin-bottom: 0.6rem; }
        .text-body ul { padding-left: 1.2rem; margin-bottom: 0.6rem; }
        .text-body li { margin-bottom: 0.35rem; }

        /* Термины (Плашки) */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1.2rem;
        }

        .tag-pill {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* Раскрывающиеся аккордеоны (<details>) */
        details {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        summary {
            padding: 0.85rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            color: var(--text-primary);
            outline: none;
        }

        summary:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .accordion-body {
            padding: 0.9rem 1rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.88rem;
            line-height: 1.55;
            color: var(--text-primary);
        }

        /* --- НАСТРОЙКИ --- */
        .settings-card {
            max-width: 480px;
            margin: 2.5rem auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .settings-card h2 {
            margin-bottom: 1.2rem;
            font-size: 1.15rem;
            text-align: center;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--card-border);
        }

        .form-row:last-child { border-bottom: none; }

        select {
            background: var(--panel-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <span>📖</span> Вся історія на НМТ
        </div>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук дати або події..." oninput="searchEvents()">
            </div>
            <button class="nav-btn active" onclick="switchPage('timeline')">Шкала</button>
            <button class="nav-btn" onclick="switchPage('settings')">⚙️ Налаштування</button>
        </div>
    </header>

    <main>
        <div id="page-timeline" class="tab-page active">
            <div class="timeline-viewport" id="timelineViewport">
                <div class="timeline-canvas" id="timelineCanvas">
                    <div class="timeline-line" id="timelineLine"></div>
                    <div id="periodsContainer"></div>
                    <div id="nodesContainer"></div>
                </div>
            </div>
        </div>

        <div id="page-settings" class="tab-page">
            <div class="settings-card">
                <h2>⚙️ Налаштування</h2>
                
                <div class="form-row">
                    <span>Тема оформлення:</span>
                    <select id="themeSelect" onchange="setTheme(this.value)">
                        <option value="dark">Темна (Графіт)</option>
                        <option value="light">Світла</option>
                        <option value="sepia">Сепія</option>
                    </select>
                </div>

                <div class="form-row">
                    <span>Відстань між датами:</span>
                    <select id="spacingSelect" onchange="setSpacing(this.value)">
                        <option value="fixed">Широка (Рівномірна)</option>
                        <option value="dynamic">Динамічна (за роками)</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
        <div class="modal-window">
            <div class="modal-top">
                <div>
                    <div class="modal-title-text" id="mTitle">Заголовок</div>
                    <div class="modal-date-text" id="mDate">Дата</div>
                </div>
                <button class="btn-close" onclick="hideModal()">✕</button>
            </div>
            <div class="modal-content" id="mContent">
                </div>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        const MONTHS = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];

        let currentActiveId = null;
        let spacingMode = 'fixed'; // 'fixed' | 'dynamic'

        // Преобразование дат в числовое значение для координат
        function calculateYearVal(rawDate) {
            if (typeof rawDate === 'number') return rawDate;
            if (!rawDate) return 0;

            const str = String(rawDate).trim();
            const parts = str.split('.');

            if (parts.length === 3) return parseFloat(parts[2]) + (parseFloat(parts[1]) / 12);
            if (parts.length === 2) return parseFloat(parts[1]) + (parseFloat(parts[0]) / 12);
            return parseFloat(str) || 0;
        }

        // Красивое форматирование даты если yearText не указан
        function formatYearDisplay(item) {
            if (item.yearText) return item.yearText;

            const val = item.date;
            if (typeof val === 'number') {
                if (val < 0) {
                    const abs = Math.abs(val);
                    if (abs >= 1000000) return `${abs / 1000000} млн р. тому`;
                    if (abs >= 1000) return `${abs / 1000} тис. р. тому`;
                    return `${abs} р. до н.е.`;
                }
                return `${val} р.`;
            }

            const str = String(val).trim();
            const parts = str.split('.');

            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = MONTHS[parseInt(parts[1], 10) - 1] || '';
                return `${day} ${month} ${parts[2]} р.`;
            } else if (parts.length === 2) {
                const month = MONTHS[parseInt(parts[0], 10) - 1] || '';
                return `${month} ${parts[1]} р.`;
            }

            return `${str} р.`;
        }

        // Рендеринг шкалы
        function buildTimeline() {
            if (typeof eventsData === 'undefined') return;

            const canvas = document.getElementById('timelineCanvas');
            const nodesDiv = document.getElementById('nodesContainer');
            const periodsDiv = document.getElementById('periodsContainer');
            const line = document.getElementById('timelineLine');

            nodesDiv.innerHTML = '';
            periodsDiv.innerHTML = '';

            const sorted = [...eventsData].sort((a, b) => calculateYearVal(a.date) - calculateYearVal(b.date));

            const positions = {};
            let maxPos = 0;
            const gap = 180;

            sorted.forEach((ev, idx) => {
                let posX = 0;
                if (spacingMode === 'fixed') {
                    posX = 60 + idx * gap;
                } else {
                    if (idx === 0) posX = 60;
                    else {
                        const prevYear = calculateYearVal(sorted[idx - 1].date);
                        const currYear = calculateYearVal(ev.date);
                        const diff = Math.max(1, currYear - prevYear);
                        const step = Math.min(380, Math.max(130, Math.log10(diff + 1) * 90));
                        posX = positions[sorted[idx - 1].id] + step;
                    }
                }
                positions[ev.id] = posX;
                maxPos = posX + 160;
            });

            canvas.style.width = `${maxPos}px`;
            line.style.width = `${maxPos}px`;

            // Рисуем точки событий
            sorted.forEach(ev => {
                const posX = positions[ev.id];
                const node = document.createElement('div');
                node.className = `event-node ${currentActiveId === ev.id ? 'selected' : ''}`;
                node.id = `node-${ev.id}`;
                node.style.left = `${posX}px`;

                node.innerHTML = `
                    <div class="node-circle"></div>
                    <div class="node-info">
                        <div class="node-year">${formatYearDisplay(ev)}</div>
                        <div class="node-heading">${ev.title}</div>
                    </div>
                `;

                node.onclick = () => openModal(ev);
                nodesDiv.appendChild(node);
            });

            // Рисуем отрезки периодов над шкалой
            if (typeof periodsData !== 'undefined') {
                periodsData.forEach(p => {
                    const startX = positions[p.startEventId];
                    const endX = positions[p.endEventId];

                    if (startX !== undefined && endX !== undefined) {
                        const bar = document.createElement('div');
                        bar.className = 'period-segment';
                        bar.style.left = `${startX}px`;
                        bar.style.width = `${endX - startX}px`;
                        bar.style.backgroundColor = p.color || '#6366f1';
                        bar.innerText = p.title;
                        periodsDiv.appendChild(bar);
                    }
                });
            }
        }

        // Открытие модалки конспекта
        function openModal(ev) {
            if (currentActiveId === ev.id) {
                hideModal();
                return;
            }

            currentActiveId = ev.id;
            document.querySelectorAll('.event-node').forEach(n => n.classList.remove('selected'));
            const nodeEl = document.getElementById(`node-${ev.id}`);
            if (nodeEl) nodeEl.classList.add('selected');

            document.getElementById('mTitle').innerText = ev.title;
            document.getElementById('mDate').innerText = formatYearDisplay(ev);

            const container = document.getElementById('mContent');
            container.innerHTML = '';

            // Галерея картинок
            if (ev.images && ev.images.length > 0) {
                const gal = document.createElement('div');
                gal.className = 'gallery-container';
                ev.images.forEach(img => {
                    gal.innerHTML += `
                        <div class="gallery-item">
                            <img src="${img.url}" class="gallery-img" alt="${img.caption || ''}">
                            ${img.caption ? `<div class="gallery-caption">${img.caption}</div>` : ''}
                        </div>
                    `;
                });
                container.appendChild(gal);
            }

            // Основной текст
            if (ev.details && ev.details.fullText) {
                const txt = document.createElement('div');
                txt.className = 'text-body';
                txt.innerHTML = ev.details.fullText;
                container.appendChild(txt);
            }

            // Термины
            if (ev.details && ev.details.terms && ev.details.terms.length > 0) {
                const tags = document.createElement('div');
                tags.className = 'tags-wrapper';
                ev.details.terms.forEach(term => {
                    tags.innerHTML += `<span class="tag-pill"># ${term}</span>`;
                });
                container.appendChild(tags);
            }

            // Раскрывающиеся аккордеоны (<details>)
            if (ev.details && ev.details.accordions && ev.details.accordions.length > 0) {
                ev.details.accordions.forEach(acc => {
                    const det = document.createElement('details');
                    det.innerHTML = `
                        <summary>${acc.title}</summary>
                        <div class="accordion-body">${acc.content}</div>
                    `;
                    container.appendChild(det);
                });
            }

            document.getElementById('modalBackdrop').classList.add('open');
        }

        function hideModal() {
            document.getElementById('modalBackdrop').classList.remove('open');
            document.querySelectorAll('.event-node').forEach(n => n.classList.remove('selected'));
            currentActiveId = null;
        }

        function handleBackdropClick(e) {
            if (e.target.id === 'modalBackdrop') hideModal();
        }

        // Навигация и поиск
        function switchPage(page) {
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`page-${page}`).classList.add('active');
            event.target.classList.add('active');
        }

        function setTheme(theme) {
            document.body.className = theme === 'dark' ? '' : `${theme}-theme`;
        }

        function setSpacing(mode) {
            spacingMode = mode;
            buildTimeline();
        }

        function searchEvents() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) return;

            const match = eventsData.find(ev => 
                ev.title.toLowerCase().includes(q) || 
                (ev.yearText && ev.yearText.toLowerCase().includes(q)) ||
                String(ev.date).includes(q)
            );

            if (match) {
                const node = document.getElementById(`node-${match.id}`);
                if (node) {
                    node.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'center' });
                    openModal(match);
                }
            }
        }

        window.onload = buildTimeline;
    </script>
</body>
</html>

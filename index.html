<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPrep NMT | Інтерактивна платформа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #151c2c;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26334d;
      --bubble-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header-container {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.1rem; }
    .logo span { color: var(--accent-gold); }

    .settings-trigger-btn {
      background: none; border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-main); font-size: 0.85rem;
      font-weight: 600; cursor: pointer; padding: 0.3rem 0.6rem;
    }

    .nav-links { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 600; padding: 0.3rem 0.6rem;
      border-radius: 6px; white-space: nowrap; cursor: pointer;
    }
    .nav-btn.active { color: var(--text-main); background-color: var(--border-color); }

    .search-box input {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.85rem; outline: none;
    }

    /* Главный контейнер таймлайна */
    .timeline-container {
      position: relative;
      width: 100%;
      margin-top: 1rem;
    }

    .timeline-scroll-area {
      display: flex;
      overflow-x: auto;
      position: relative;
      padding: 6rem 1rem 6rem 1rem;
      width: 100%;
      cursor: grab;
      user-select: none;
      scrollbar-width: none;
    }
    .timeline-scroll-area::-webkit-scrollbar { display: none; }
    .timeline-scroll-area:active { cursor: grabbing; }

    .timeline-ticks {
      display: flex;
      position: relative;
      z-index: 2;
      align-items: center;
      width: max-content;
      padding-right: 5rem;
    }

    /* Главная ось */
    .timeline-axis-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--accent-gold);
      z-index: 1;
      transform: translateY(-50%);
    }

    /* СТРЕЛКА НА ПРАВОМ КРАЮ ЭКРАНА (FIXED) */
    .fixed-arrow-right {
      position: fixed;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--accent-gold);
      z-index: 50;
      pointer-events: none;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 50%;
    }

    /* Полоска процесса (Над осью) */
    .period-bar {
      position: absolute;
      height: 4px;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.15s, height 0.15s, opacity 0.2s;
      z-index: 4;
      opacity: 0.9;
    }
    .period-bar:hover { height: 6px; opacity: 1; }

    /* Элемент точки */
    .tick-wrapper { display: flex; align-items: center; position: relative; }

    .tick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 110px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    /* ТОЧКА СТРОГО НА ОСИ */
    .tick-mark {
      width: 16px;
      height: 16px;
      background: var(--accent-gold);
      border-radius: 50%;
      border: 3px solid var(--bg-color);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      transition: transform 0.2s, background-color 0.2s;
    }

    .tick-item:hover .tick-mark, 
    .tick-item.active .tick-mark {
      transform: translate(-50%, -50%) scale(1.4);
      background: var(--accent-blue);
    }

    .tick-item.highlighted .tick-mark {
      transform: translate(-50%, -50%) scale(1.4);
      background: #60a5fa !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 10px #60a5fa;
    }

    /* Блок текста (Сверху или Снизу) */
    .tick-content-box {
      position: absolute;
      width: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pos-top { bottom: 25px; }
    .pos-bottom { top: 25px; }

    .tick-year { font-weight: 800; font-size: 0.82rem; color: var(--accent-gold); }
    .tick-short-title { font-size: 0.78rem; color: var(--text-muted); line-height: 1.2; margin-top: 2px; }

    /* Красивый волнистый разрыв времени */
    .time-gap-break {
      width: 30px;
      height: 12px;
      position: relative;
      z-index: 3;
      background: radial-gradient(circle, var(--accent-gold) 20%, transparent 20%);
      background-size: 6px 6px;
      opacity: 0.6;
    }

    /* Tooltip */
    .floating-tooltip {
      position: fixed;
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      z-index: 2000;
      pointer-events: none;
      max-width: 260px;
    }
    .floating-tooltip-title { font-weight: 700; color: var(--accent-blue); margin-bottom: 3px; }

    /* Конспект */
    .speech-bubble {
      position: relative; margin: 1rem; background: var(--bubble-bg);
      border: 2px solid var(--accent-blue); border-radius: 14px; padding: 1.4rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .speech-bubble.hidden { display: none !important; }

    .bubble-close {
      position: absolute; top: 10px; right: 14px; font-size: 1.6rem;
      background: none; border: none; color: var(--text-muted); cursor: pointer;
    }

    .bubble-year { color: var(--accent-gold); font-weight: 900; font-size: 1.15rem; margin-bottom: 4px; display: inline-block; }
    .bubble-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .bubble-body { margin-top: 1rem; font-size: 0.95rem; line-height: 1.6; color: var(--text-main); }
    .bubble-terms { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); font-size: 0.85rem; color: var(--accent-gold); }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-row">
      <div class="logo">EduPrep <span>НМТ</span></div>
      <button id="open-settings-btn" class="settings-trigger-btn">⚙ Налаштування</button>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active">Історія України</button>
      <button class="nav-btn">Діячі</button>
      <button class="nav-btn">Пам'ятки</button>
      <button class="nav-btn">Шпори</button>
    </nav>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Пошук року, події чи терміну...">
    </div>
  </header>

  <main>
    <div class="timeline-container">
      <div class="timeline-scroll-area" id="scroll-area">
        <div class="timeline-ticks" id="timeline-ticks">
          <div class="timeline-axis-line"></div>
        </div>
      </div>
      <div class="fixed-arrow-right">►</div>
    </div>

    <div id="details-bubble" class="speech-bubble hidden">
      <button class="bubble-close" id="close-bubble">&times;</button>
      <div class="bubble-header">
        <span class="bubble-year" id="det-year"></span>
        <h3 id="det-title"></h3>
      </div>
      <div class="bubble-body" id="det-body"></div>
      <div class="bubble-terms" id="det-terms"></div>
    </div>
  </main>

  <div id="floating-tooltip" class="floating-tooltip">
    <div id="tooltip-title" class="floating-tooltip-title"></div>
    <div id="tooltip-desc"></div>
  </div>

  <script src="data.js"></script>

  <script>
    // Римские цифры
    function toRoman(num) {
      var lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1}, roman = '', i;
      for (i in lookup) {
        while (num >= lookup[i]) { roman += i; num -= lookup[i]; }
      }
      return roman;
    }

    // Автоматический конвертер дат в красивый украинский текст
    function parseDateToText(dateInput) {
      if (typeof dateInput === 'string') {
        var parts = dateInput.split('.');
        if (parts.length === 3) {
          var months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
          var mIndex = parseInt(parts[1], 10) - 1;
          return parseInt(parts[0], 10) + ' ' + months[mIndex] + ' ' + parts[2] + ' р.';
        }
        if (parts.length === 2) {
          var monthsCap = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
          var mIndex = parseInt(parts[0], 10) - 1;
          return monthsCap[mIndex] + ' ' + parts[1] + ' р.';
        }
      }

      var num = parseFloat(dateInput);
      if (isNaN(num)) return dateInput;

      if (num < 0) {
        var abs = Math.abs(num);
        if (abs >= 1000) {
          var thous = Math.round(abs / 1000);
          return toRoman(thous) + ' тис. до н. е.';
        } else {
          var cent = Math.ceil(abs / 100);
          return toRoman(cent) + ' ст. до н. е.';
        }
      } else {
        return num + ' р.';
      }
    }

    // Расчет числового значения года для дистанций
    function getNumericYear(dateInput) {
      if (typeof dateInput === 'number') return dateInput;
      if (typeof dateInput === 'string') {
        var parts = dateInput.split('.');
        if (parts.length === 3) return parseFloat(parts[2]) + (parseFloat(parts[1])/12);
        if (parts.length === 2) return parseFloat(parts[1]) + (parseFloat(parts[0])/12);
        return parseFloat(dateInput) || 0;
      }
      return 0;
    }

    var currentActiveId = null;

    function renderTimeline(data) {
      var container = document.getElementById('timeline-ticks');
      if (!container) return;
      
      container.innerHTML = '<div class="timeline-axis-line"></div>';

      if (!data || data.length === 0) return;

      // Сортировка по дате
      data.sort(function(a, b) {
        return getNumericYear(a.date) - getNumericYear(b.date);
      });

      var tickElements = {};

      // Определяем, какие точки входят в процессы (чтобы их текст сместить вниз)
      var pointsInPeriods = {};
      if (typeof periodsData !== 'undefined') {
        periodsData.forEach(function(p) {
          pointsInPeriods[p.startEventId] = true;
          pointsInPeriods[p.endEventId] = true;
        });
      }

      for (var i = 0; i < data.length; i++) {
        (function(item, index) {
          var displayYear = item.yearText || parseDateToText(item.date);
          
          var wrapper = document.createElement('div');
          wrapper.className = 'tick-wrapper';

          // Динамический расчет расстояния между точками
          var gap = 70; 
          if (index < data.length - 1) {
            var diff = Math.abs(getNumericYear(data[index+1].date) - getNumericYear(item.date));
            if (diff > 500) gap = 140;
            else if (diff > 100) gap = 100;
            else if (diff < 5) gap = 50;
          }

          var tick = document.createElement('div');
          tick.className = 'tick-item' + (currentActiveId === item.id ? ' active' : '');
          tick.style.marginRight = gap + 'px';
          tick.setAttribute('data-id', item.id);

          // Умное распределение текст сверху/снизу
          var positionClass = 'pos-top';
          if (pointsInPeriods[item.id] || index % 2 !== 0) {
            positionClass = 'pos-bottom';
          }

          tick.innerHTML = 
            '<div class="tick-mark"></div>' +
            '<div class="tick-content-box ' + positionClass + '">' +
              '<div class="tick-year">' + displayYear + '</div>' +
              '<div class="tick-short-title">' + item.title + '</div>' +
            '</div>';
          
          tick.onclick = function() {
            if (currentActiveId === item.id) {
              closeBubble();
            } else {
              document.querySelectorAll('.tick-item').forEach(function(el) { el.classList.remove('active'); });
              tick.classList.add('active');
              currentActiveId = item.id;
              openBubble(item, displayYear);
            }
          };

          wrapper.appendChild(tick);

          // Добавляем красивый разрыв, если пауза огромная
          if (gap >= 140 && index < data.length - 1) {
            var gapMark = document.createElement('div');
            gapMark.className = 'time-gap-break';
            gapMark.style.marginRight = gap + 'px';
            wrapper.appendChild(gapMark);
          }

          container.appendChild(wrapper);
          tickElements[item.id] = tick;
        })(data[i], i);
      }

      setTimeout(function() {
        renderPeriods(tickElements);
      }, 50);
    }

    function renderPeriods(tickElements) {
      if (typeof periodsData === 'undefined') return;

      var container = document.getElementById('timeline-ticks');
      var tooltip = document.getElementById('floating-tooltip');

      periodsData.forEach(function(period) {
        var startEl = tickElements[period.startEventId];
        var endEl = tickElements[period.endEventId];

        if (startEl && endEl) {
          var startRect = startEl.getBoundingClientRect();
          var endRect = endEl.getBoundingClientRect();
          var containerRect = container.getBoundingClientRect();

          var leftPos = (startRect.left + startRect.width / 2) - containerRect.left;
          var rightPos = (endRect.left + endRect.width / 2) - containerRect.left;
          var width = rightPos - leftPos;

          var bar = document.createElement('div');
          bar.className = 'period-bar';
          bar.style.left = leftPos + 'px';
          bar.style.width = width + 'px';
          
          // Полоса строго над оранжевой осью
          bar.style.top = 'calc(50% - 12px)';
          bar.style.backgroundColor = period.color || '#3b82f6';

          function showTooltip(e) {
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top = (e.clientY + 12) + 'px';
            document.getElementById('tooltip-title').innerText = period.title;
            document.getElementById('tooltip-desc').innerText = period.description;

            startEl.classList.add('highlighted');
            endEl.classList.add('highlighted');
          }

          function hideTooltip() {
            tooltip.style.display = 'none';
            startEl.classList.remove('highlighted');
            endEl.classList.remove('highlighted');
          }

          bar.onmousemove = showTooltip;
          bar.onmouseleave = hideTooltip;
          bar.onclick = function(e) {
            e.stopPropagation();
            showTooltip(e);
          };

          container.appendChild(bar);
        }
      });
    }

    function openBubble(item, displayYear) {
      var bubble = document.getElementById('details-bubble');
      document.getElementById('det-year').innerText = displayYear;
      document.getElementById('det-title').innerText = item.title;
      document.getElementById('det-body').innerHTML = item.details.fullText;
      
      var termsBox = document.getElementById('det-terms');
      if (item.details.terms && item.details.terms.length > 0) {
        termsBox.innerHTML = '<b>Терміни НМТ:</b> ' + item.details.terms.join(' • ');
        termsBox.style.display = 'block';
      } else {
        termsBox.style.display = 'none';
      }
      
      bubble.classList.remove('hidden');
    }

    function closeBubble() {
      document.getElementById('details-bubble').classList.add('hidden');
      document.querySelectorAll('.tick-item').forEach(function(el) { el.classList.remove('active'); });
      currentActiveId = null;
    }

    // Скролл мышкой / тачпадом
    var scrollArea = document.getElementById('scroll-area');
    var isDown = false, startX, scrollLeft;

    scrollArea.addEventListener('wheel', function(e) {
      if (e.deltaY !== 0) {
        e.preventDefault();
        scrollArea.scrollLeft += e.deltaY;
      }
    });

    scrollArea.addEventListener('mousedown', function(e) {
      isDown = true;
      startX = e.pageX - scrollArea.offsetLeft;
      scrollLeft = scrollArea.scrollLeft;
    });

    scrollArea.addEventListener('mouseleave', function() { isDown = false; });
    scrollArea.addEventListener('mouseup', function() { isDown = false; });

    scrollArea.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      var x = e.pageX - scrollArea.offsetLeft;
      var walk = (x - startX) * 1.5;
      if (Math.abs(walk) > 5) {
        e.preventDefault();
        scrollArea.scrollLeft = scrollLeft - walk;
      }
    });

    if (typeof eventsData !== 'undefined') {
      renderTimeline(eventsData);
    }

    document.getElementById('close-bubble').onclick = closeBubble;
  </script>
</body>
</html>

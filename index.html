<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Історія України | НМТ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #151c2c;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26334d;
      --bubble-bg: #1e293b;
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --bubble-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Шапка */
    .header-container {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-weight: 900; font-size: 1rem; }
    .logo span { color: var(--accent-gold); }

    .settings-trigger-btn {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.6rem;
    }

    /* Вкладки */
    .nav-links {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--text-main);
      background-color: var(--border-color);
    }

    /* Поиск */
    .search-box input {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Шкала времени */
    .timeline-container {
      position: relative;
      width: 100%;
      margin-top: 1.5rem;
    }

    .fixed-arrow-right {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--accent-gold);
      z-index: 10;
      pointer-events: none;
      background: var(--bg-color);
      padding: 0 4px;
    }

    .timeline-scroll-area {
      display: flex;
      overflow-x: auto;
      position: relative;
      padding: 2.5rem 3rem 2.5rem 1rem;
    }

    .timeline-axis-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--accent-gold);
      z-index: 1;
    }

    .timeline-ticks {
      display: flex;
      gap: 2.5rem;
      position: relative;
      z-index: 2;
      align-items: center;
    }

    .tick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 120px;
      text-align: center;
    }

    .tick-mark {
      width: 14px;
      height: 14px;
      background: var(--accent-gold);
      border-radius: 50%;
      border: 2px solid var(--bg-color);
      margin: 6px 0;
      transition: transform 0.2s;
    }

    .tick-item:hover .tick-mark, .tick-item.active .tick-mark {
      transform: scale(1.4);
      background: var(--accent-blue);
    }

    .tick-year {
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--accent-gold);
    }

    .tick-short-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      max-width: 110px;
      line-height: 1.1;
    }

    /* Всплывающий конспект */
    .speech-bubble {
      position: relative;
      margin: 15px 10px;
      background: var(--bubble-bg);
      border: 2px solid var(--accent-blue);
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .speech-bubble.hidden { display: none !important; }

    .bubble-close {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 1.4rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .bubble-year { color: var(--accent-gold); font-weight: 800; font-size: 1rem; }
    .bubble-body { margin-top: 0.8rem; font-size: 0.85rem; line-height: 1.4; }

    /* Настройки (Модалка) СТРІГО СПРЯТАНА ПО УМОЛЧАНИЮ */
    .modal-wrapper {
      display: none; /* По умолчанию скрыто! */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1000;
    }
    .modal-wrapper.open {
      display: block !important;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
    }

    .modal-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      width: 85%;
      max-width: 360px;
      z-index: 1001;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: none; border: none; font-size: 1.4rem; color: var(--text-main); cursor: pointer; }
    .setting-item { margin-bottom: 1rem; }
    .setting-item label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .toggle-group { display: flex; gap: 0.5rem; }
    .btn-toggle {
      flex: 1; padding: 0.4rem; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .btn-toggle.active { background: var(--accent-blue); border-color: var(--accent-blue); }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-row">
      <div class="logo">Історія України <span>НМТ</span></div>
      <button id="open-settings-btn" class="settings-trigger-btn">⚙ Налаштування</button>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active">Хронологія</button>
      <button class="nav-btn">Діячі</button>
      <button class="nav-btn">Пам'ятки</button>
      <button class="nav-btn">Шпори</button>
    </nav>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Пошук року, події чи терміну...">
    </div>
  </header>

  <main>
    <div class="timeline-container">
      <div class="fixed-arrow-right">►</div>
      <div class="timeline-scroll-area">
        <div class="timeline-axis-line"></div>
        <div class="timeline-ticks" id="timeline-ticks">
          </div>
      </div>
    </div>

    <div id="details-bubble" class="speech-bubble hidden">
      <button class="bubble-close" id="close-bubble">&times;</button>
      <div class="bubble-header">
        <span class="bubble-year" id="det-year"></span>
        <h3 id="det-title" style="margin-top:4px;"></h3>
      </div>
      <div class="bubble-body" id="det-body"></div>
    </div>
  </main>

  <div id="settings-modal" class="modal-wrapper">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Налаштування</h3>
        <button id="close-settings-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label>Тема оформлення:</label>
          <div class="toggle-group">
            <button id="btn-theme-dark" class="btn-toggle active">Темна</button>
            <button id="btn-theme-light" class="btn-toggle">Світла</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Базовый набор дат из Turbo ZNO
    const initialEvents = [
      {
        id: "1",
        year: "1 млн р. тому",
        title: "Поява першої людини",
        details: {
          fullText: "<b>Палеоліт.</b> Перша відома стоянка — <b>с. Королеве (Закарпаття)</b>.<br>Інші стоянки: Мізин, Кирилівка, Межиріч, Киїк-Коба, Амвросіївка.",
          terms: ["Палеоліт", "Привласнювальне господарство", "Стоянка"]
        }
      },
      {
        id: "2",
        year: "IV-III тис. до н.е.",
        title: "Трипільська культура",
        details: {
          fullText: "<b>Енеоліт.</b> Освоєння міді, землеробство, мальована кераміка, протоміста. Відкрив Вікентій Хвойка.",
          terms: ["Енеоліт", "Відтворювальне господарство", "Протоміста"]
        }
      },
      {
        id: "3",
        year: "IX-VIII ст. до н.е.",
        title: "Кіммерійці",
        details: {
          fullText: "Перший кочовий народ на території України, згаданий у писемних джерелах (Гомер). Освоїли залізо.",
          terms: ["Залізний вік", "Кочівники"]
        }
      },
      {
        id: "4",
        year: "VII-III ст. до н.е.",
        title: "Скіфи",
        details: {
          fullText: "Велика Скіфія. Царські скіфи, кургани (Товста Могила, Пектораль), похід Дарія I.",
          terms: ["Курган", "Пектораль", "Звіриний стиль"]
        }
      }
    ];

    let eventsData = initialEvents;

    // Рендер точек на линии
    function renderTimelineTicks(data) {
      const container = document.getElementById('timeline-ticks');
      if (!container) return;
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #94a3b8;">Подій не знайдено</div>';
        return;
      }

      data.forEach((item) => {
        const tick = document.createElement('div');
        tick.className = 'tick-item';
        tick.innerHTML = `
          <div class="tick-year">${item.year}</div>
          <div class="tick-mark"></div>
          <div class="tick-short-title">${item.title}</div>
        `;
        
        tick.onclick = () => {
          document.querySelectorAll('.tick-item').forEach(el => el.classList.remove('active'));
          tick.classList.add('active');
          openBubble(item);
        };

        container.appendChild(tick);
      });
    }

    function openBubble(item) {
      const bubble = document.getElementById('details-bubble');
      document.getElementById('det-year').innerText = item.year;
      document.getElementById('det-title').innerText = item.title;
      
      let contentHtml = `<p>${item.details.fullText}</p>`;
      if (item.details.terms && item.details.terms.length > 0) {
        contentHtml += `<div style="margin-top:10px; font-size: 0.8rem; color: #f59e0b;"><b>Терміни:</b> ${item.details.terms.join(', ')}</div>`;
      }
      
      document.getElementById('det-body').innerHTML = contentHtml;
      bubble.classList.remove('hidden');
    }

    // Слушатели событий
    window.onload = () => {
      renderTimelineTicks(eventsData);

      // Закрытие баббла
      document.getElementById('close-bubble').onclick = () => {
        document.getElementById('details-bubble').classList.add('hidden');
        document.querySelectorAll('.tick-item').forEach(el => el.classList.remove('active'));
      };

      // Поиск
      document.getElementById('search-input').oninput = function(e) {
        const val = e.target.value.toLowerCase().trim();
        const filtered = eventsData.filter(item => 
          item.year.toLowerCase().includes(val) || 
          item.title.toLowerCase().includes(val) ||
          item.details.fullText.toLowerCase().includes(val)
        );
        renderTimelineTicks(filtered);
      };

      // Модалка настроек
      const modal = document.getElementById('settings-modal');
      document.getElementById('open-settings-btn').onclick = () => modal.classList.add('open');
      document.getElementById('close-settings-btn').onclick = () => modal.classList.remove('open');
      document.getElementById('modal-overlay').onclick = () => modal.classList.remove('open');

      // Переключение тем
      const lightBtn = document.getElementById('btn-theme-light');
      const darkBtn = document.getElementById('btn-theme-dark');

      lightBtn.onclick = function() {
        document.body.classList.add('light-theme');
        this.classList.add('active');
        darkBtn.classList.remove('active');
      };

      darkBtn.onclick = function() {
        document.body.classList.remove('light-theme');
        this.classList.add('active');
        lightBtn.classList.remove('active');
      };
    };
  </script>
</body>
</html>

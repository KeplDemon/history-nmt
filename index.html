<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>EduPrep НМТ — Вся історія</title>
    <style>
        :root {
            --bg-main: #0d0f12;
            --panel-bg: #151821;
            --card-bg: #1e2230;
            --card-border: #2d3448;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            /* Оранжевая палитра EduPrep */
            --orange-primary: #ff6b00;
            --orange-hover: #ff8533;
            --orange-glow: rgba(255, 107, 0, 0.4);
            --orange-light: rgba(255, 107, 0, 0.15);
            
            --timeline-axis: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Страница не скроллится, скроллится только шкала */
            user-select: none;
        }

        /* --- ШАПКА ЕDUPREP --- */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--orange-primary);
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 230px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--orange-primary);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--orange-primary);
            color: var(--orange-primary);
            background: var(--card-bg);
        }

        /* --- ПРИБИТАЯ СТРЕЛКА НАПРАВЛЕНИЯ ВРЕМЕНИ (СПРАВА) --- */
        .pinned-arrow {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 40;
            background: var(--panel-bg);
            border: 1px solid var(--orange-primary);
            color: var(--orange-primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 15px var(--orange-glow);
            pointer-events: none;
        }

        /* --- КОНТЕЙНЕР ШКАЛЫ ВРЕМЕНИ --- */
        .timeline-section {
            flex: 1;
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            cursor: grab;
            
            /* Хак для размещения скроллбара СВЕРХУ шкалы */
            transform: rotateX(180deg);
        }

        .timeline-section:active {
            cursor: grabbing;
        }

        /* Кастомный оранжевый скроллбар */
        .timeline-section::-webkit-scrollbar {
            height: 8px;
        }
        .timeline-section::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }
        .timeline-section::-webkit-scrollbar-thumb {
            background: var(--orange-primary);
            border-radius: 4px;
        }

        .timeline-inner {
            position: relative;
            height: 100%;
            min-height: 380px;
            padding: 0 80px;
            /* Возвращаем нормальную ориентацию контенту после переворота скроллбара */
            transform: rotateX(180deg);
        }

        /* Главная ось времени */
        .timeline-axis-line {
            position: absolute;
            top: 190px;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--timeline-axis);
            border-radius: 2px;
        }

        /* --- ПОЛОСЫ ПЕРИОДОВ (БЕЗ ТЕКСТА) --- */
        .period-bar-item {
            position: absolute;
            top: 168px; /* Чуть выше оси */
            height: 8px;
            border-radius: 4px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }

        .period-bar-item:hover {
            transform: scaleY(1.5);
            filter: brightness(1.2);
        }

        /* --- ТОЧКИ СОБЫТИЙ И ЧЕРЕДОВАНИЕ ПОДПИСЕЙ --- */
        .timeline-node-item {
            position: absolute;
            top: 192px; /* Центровка по оси */
            transform: translateX(-50%);
            z-index: 5;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node-dot-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: var(--orange-primary);
            border: 3px solid var(--bg-main);
            box-shadow: 0 0 10px var(--orange-glow);
            transition: all 0.2s;
        }

        .timeline-node-item:hover .node-dot-circle,
        .timeline-node-item.active .node-dot-circle {
            background-color: #ffffff;
            border-color: var(--orange-primary);
            transform: scale(1.3);
            box-shadow: 0 0 15px var(--orange-primary);
        }

        /* Блок с текстом подписи */
        .node-caption-box {
            position: absolute;
            width: 150px;
            text-align: center;
            pointer-events: none;
        }

        /* Подпись СВЕРХУ */
        .timeline-node-item.pos-top .node-caption-box {
            bottom: 26px;
        }

        /* Подпись СНИЗУ */
        .timeline-node-item.pos-bottom .node-caption-box {
            top: 26px;
        }

        .node-date-lbl {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--orange-primary);
            margin-bottom: 2px;
        }

        .node-title-lbl {
            font-size: 0.78rem;
            color: var(--text-main);
            line-height: 1.25;
            font-weight: 500;
        }

        /* --- ВСПЛЫВАЮЩАЯ ПОДСКАЗКА ДЛЯ ПЕРИОДОВ (ПО МЫШКЕ) --- */
        .period-tooltip {
            position: fixed;
            display: none;
            z-index: 100;
            background: var(--card-bg);
            border: 1px solid var(--orange-primary);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            pointer-events: none;
            max-width: 280px;
        }

        .period-tooltip-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--orange-primary);
            margin-bottom: 3px;
        }

        .period-tooltip-desc {
            font-size: 0.78rem;
            color: var(--text-main);
            line-height: 1.3;
        }

        /* --- ПАНЕЛЬ КОНСПЕКТА (ПОД ШКАЛОЙ, НЕ ЗАКРЫВАЕТ ВСЁ ОКНО) --- */
        .note-panel-drawer {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 800px;
            height: 48vh;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 3px solid var(--orange-primary);
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.8);
            z-index: 60;
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .note-panel-drawer.open {
            bottom: 0;
        }

        .drawer-header {
            padding: 1rem 1.4rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 14px 14px 0 0;
        }

        .drawer-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .drawer-date {
            font-size: 0.88rem;
            color: var(--orange-primary);
            font-weight: 700;
            margin-top: 2px;
        }

        .drawer-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 0.4rem;
        }

        .drawer-close-btn:hover {
            color: var(--orange-primary);
        }

        .drawer-body {
            padding: 1.2rem 1.4rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Элементы внутри конспекта */
        .note-images {
            display: flex;
            gap: 12px;
            margin-bottom: 1rem;
            overflow-x: auto;
        }

        .note-img {
            max-height: 220px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            object-fit: contain;
        }

        .note-text {
            line-height: 1.6;
            font-size: 0.92rem;
            margin-bottom: 1rem;
        }

        .note-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .tag-badge {
            background: var(--orange-light);
            border: 1px solid var(--orange-primary);
            color: var(--orange-primary);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Спойлеры <details> */
        details {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        summary {
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            color: var(--text-main);
            outline: none;
        }

        summary:hover {
            background: rgba(255, 107, 0, 0.05);
            color: var(--orange-primary);
        }

        .acc-content {
            padding: 0.8rem 1rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* МОДАЛКА НАСТРОЕК */
        .settings-modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .settings-modal-backdrop.open {
            display: flex;
        }

        .settings-modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            width: 380px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <span>EduPrep</span> НМТ
        </div>
        <div class="header-tools">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук дати або події..." oninput="handleSearch()">
            <button class="icon-btn" onclick="toggleSettingsModal(true)">⚙️ Налаштування</button>
        </div>
    </header>

    <div class="pinned-arrow" title="Плин часу">→</div>

    <div class="period-tooltip" id="periodTooltip">
        <div class="period-tooltip-title" id="ttTitle"></div>
        <div class="period-tooltip-desc" id="ttDesc"></div>
    </div>

    <div class="timeline-section" id="timelineViewport">
        <div class="timeline-inner" id="timelineInner">
            <div class="timeline-axis-line" id="timelineAxis"></div>
            <div id="periodsLayer"></div>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <div class="note-panel-drawer" id="noteDrawer">
        <div class="drawer-header">
            <div>
                <div class="drawer-title" id="dTitle">Назва події</div>
                <div class="drawer-date" id="dDate">Дата</div>
            </div>
            <button class="drawer-close-btn" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-body" id="dBody">
            </div>
    </div>

    <div class="settings-modal-backdrop" id="settingsBackdrop">
        <div class="settings-modal">
            <h3 style="margin-bottom: 1rem; color: var(--orange-primary);">⚙️ Налаштування</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <span>Відстань між датами:</span>
                <select id="spacingSelect" style="background: var(--panel-bg); color: #fff; border: 1px solid var(--card-border); padding: 0.3rem 0.6rem; border-radius: 6px;" onchange="setSpacingMode(this.value)">
                    <option value="fixed">Широка (Рівномірна)</option>
                    <option value="dynamic">Динамічна (за роками)</option>
                </select>
            </div>
            <button class="icon-btn" style="width: 100%; text-align: center;" onclick="toggleSettingsModal(false)">Закрити</button>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        const MONTHS_UA = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
        const COLOR_PALETTE = ["#ff6b00", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#f59e0b", "#06b6d4"];

        let activeNodeId = null;
        let spacingMode = 'fixed';

        // --- 1. ПАРСИНГ ДАТ И КООРДИНАТ --- //

        function parseToYearVal(raw) {
            if (typeof raw === 'number') return raw;
            if (!raw) return 0;
            const str = String(raw).trim();
            const parts = str.split('.');

            if (parts.length === 3) return parseFloat(parts[2]) + (parseFloat(parts[1]) / 12);
            if (parts.length === 2) return parseFloat(parts[1]) + (parseFloat(parts[0]) / 12);
            return parseFloat(str) || 0;
        }

        function formatYearText(item) {
            if (item.yearText) return item.yearText;
            const raw = item.date;

            if (typeof raw === 'number') {
                if (raw < 0) {
                    const abs = Math.abs(raw);
                    if (abs >= 1000000) return `${abs / 1000000} млн р. тому`;
                    if (abs >= 1000) return `${abs / 1000} тис. р. тому`;
                    return `${abs} р. до н.е.`;
                }
                return `${raw} р.`;
            }

            const str = String(raw).trim();
            const parts = str.split('.');

            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = MONTHS_UA[parseInt(parts[1], 10) - 1] || '';
                return `${day} ${month} ${parts[2]} р.`;
            } else if (parts.length === 2) {
                const month = MONTHS_UA[parseInt(parts[0], 10) - 1] || '';
                return `${month} ${parts[0]} ${parts[1]} р.`;
            }
            return `${str} р.`;
        }

        // --- 2. РЕНДЕР ШКАЛЫ И УЗЛОВ --- //

        function renderTimeline() {
            if (typeof eventsData === 'undefined') return;

            const inner = document.getElementById('timelineInner');
            const nodesLayer = document.getElementById('nodesLayer');
            const periodsLayer = document.getElementById('periodsLayer');
            const axisLine = document.getElementById('timelineAxis');

            nodesLayer.innerHTML = '';
            periodsLayer.innerHTML = '';

            const sorted = [...eventsData].sort((a, b) => parseToYearVal(a.date) - parseToYearVal(b.date));

            const positions = {};
            let maxPos = 0;
            const gap = 190;

            sorted.forEach((ev, idx) => {
                let posX = 0;
                if (spacingMode === 'fixed') {
                    posX = 80 + idx * gap;
                } else {
                    if (idx === 0) posX = 80;
                    else {
                        const prevYear = parseToYearVal(sorted[idx - 1].date);
                        const currYear = parseToYearVal(ev.date);
                        const diff = Math.max(1, currYear - prevYear);
                        const step = Math.min(400, Math.max(130, Math.log10(diff + 1) * 95));
                        posX = positions[sorted[idx - 1].id] + step;
                    }
                }
                positions[ev.id] = posX;
                maxPos = posX + 200;
            });

            inner.style.width = `${maxPos}px`;
            axisLine.style.width = `${maxPos}px`;

            // Вычисляем диапазоны периодов для чередования
            const periodsRanges = [];
            if (typeof periodsData !== 'undefined') {
                periodsData.forEach((p, index) => {
                    const startX = positions[p.startEventId];
                    const endX = positions[p.endEventId];

                    if (startX !== undefined && endX !== undefined) {
                        const color = p.color || COLOR_PALETTE[index % COLOR_PALETTE.length];
                        
                        const bar = document.createElement('div');
                        bar.className = 'period-bar-item';
                        bar.style.left = `${startX}px`;
                        bar.style.width = `${endX - startX}px`;
                        bar.style.backgroundColor = color;

                        // Тултип при наведении
                        bar.onmousemove = (e) => showPeriodTooltip(e, p);
                        bar.onmouseleave = hidePeriodTooltip;

                        periodsLayer.appendChild(bar);
                        periodsRanges.push({ startX, endX });
                    }
                });
            }

            // Отрисовка точек дат с логикой переключения СВЕРХУ / СНИЗУ
            sorted.forEach((ev, idx) => {
                const posX = positions[ev.id];

                // Базовое чередование: нечётные сверху, чётные снизу
                let isTop = (idx % 2 === 0);

                // Если точка попадает в координаты какого-то промежутка (который сверху оси) — принудительно ставим снизу!
                const insidePeriod = periodsRanges.some(r => posX >= r.startX && posX <= r.endX);
                if (insidePeriod) {
                    isTop = false; 
                }

                const node = document.createElement('div');
                node.className = `timeline-node-item ${isTop ? 'pos-top' : 'pos-bottom'} ${activeNodeId === ev.id ? 'active' : ''}`;
                node.id = `node-${ev.id}`;
                node.style.left = `${posX}px`;

                node.innerHTML = `
                    <div class="node-dot-circle"></div>
                    <div class="node-caption-box">
                        <div class="node-date-lbl">${formatYearText(ev)}</div>
                        <div class="node-title-lbl">${ev.title}</div>
                    </div>
                `;

                node.onclick = () => openDrawer(ev);
                nodesLayer.appendChild(node);
            });
        }

        // --- 3. ТУЛТИП ДЛЯ ПЕРИОДОВ --- //

        function showPeriodTooltip(e, p) {
            const tt = document.getElementById('periodTooltip');
            document.getElementById('ttTitle').innerText = p.title;
            document.getElementById('ttDesc').innerText = p.description || '';

            tt.style.display = 'block';
            tt.style.left = `${e.clientX + 12}px`;
            tt.style.top = `${e.clientY + 12}px`;
        }

        function hidePeriodTooltip() {
            document.getElementById('periodTooltip').style.display = 'none';
        }

        // --- 4. ОКНО КОНСПЕКТА (DRAWER) --- //

        function openDrawer(ev) {
            if (activeNodeId === ev.id) {
                closeDrawer();
                return;
            }

            activeNodeId = ev.id;
            document.querySelectorAll('.timeline-node-item').forEach(n => n.classList.remove('active'));
            const activeEl = document.getElementById(`node-${ev.id}`);
            if (activeEl) activeEl.classList.add('active');

            document.getElementById('dTitle').innerText = ev.title;
            document.getElementById('dDate').innerText = formatYearText(ev);

            const body = document.getElementById('dBody');
            body.innerHTML = '';

            // Картинки
            if (ev.images && ev.images.length > 0) {
                const imgsDiv = document.createElement('div');
                imgsDiv.className = 'note-images';
                ev.images.forEach(img => {
                    imgsDiv.innerHTML += `<img src="${img.url}" class="note-img" title="${img.caption || ''}">`;
                });
                body.appendChild(imgsDiv);
            }

            // Текст
            if (ev.details && ev.details.fullText) {
                const txt = document.createElement('div');
                txt.className = 'note-text';
                txt.innerHTML = ev.details.fullText;
                body.appendChild(txt);
            }

            // Термины
            if (ev.details && ev.details.terms && ev.details.terms.length > 0) {
                const tags = document.createElement('div');
                tags.className = 'note-tags';
                ev.details.terms.forEach(t => {
                    tags.innerHTML += `<span class="tag-badge"># ${t}</span>`;
                });
                body.appendChild(tags);
            }

            // Аккордеоны
            if (ev.details && ev.details.accordions && ev.details.accordions.length > 0) {
                ev.details.accordions.forEach(acc => {
                    const det = document.createElement('details');
                    det.innerHTML = `
                        <summary>${acc.title}</summary>
                        <div class="acc-content">${acc.content}</div>
                    `;
                    body.appendChild(det);
                });
            }

            document.getElementById('noteDrawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('noteDrawer').classList.remove('open');
            document.querySelectorAll('.timeline-node-item').forEach(n => n.classList.remove('active'));
            activeNodeId = null;
        }

        // --- 5. УПРАВЛЕНИЕ СКРОЛЛОМ (DRAG & KEYBOARD) --- //

        const viewport = document.getElementById('timelineViewport');
        let isMouseDown = false;
        let startMouseX, scrollLeftPos;

        // Перетаскивание мышкой (LMB Drag)
        viewport.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            startMouseX = e.pageX - viewport.offsetLeft;
            scrollLeftPos = viewport.scrollLeft;
        });

        viewport.addEventListener('mouseleave', () => { isMouseDown = false; });
        viewport.addEventListener('mouseup', () => { isMouseDown = false; });

        viewport.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            e.preventDefault();
            const x = e.pageX - viewport.offsetLeft;
            const walk = (x - startMouseX) * 1.6;
            viewport.scrollLeft = scrollLeftPos - walk;
        });

        // Прокрутка колесиком
        viewport.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                viewport.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        // Управление клавишами (Стрелки)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                viewport.scrollLeft += 120;
            } else if (e.key === 'ArrowLeft') {
                viewport.scrollLeft -= 120;
            }
        });

        // Поиск
        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) return;

            const match = eventsData.find(ev => 
                ev.title.toLowerCase().includes(q) || 
                (ev.yearText && ev.yearText.toLowerCase().includes(q)) ||
                String(ev.date).includes(q)
            );

            if (match) {
                const el = document.getElementById(`node-${match.id}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    openDrawer(match);
                }
            }
        }

        function toggleSettingsModal(show) {
            document.getElementById('settingsBackdrop').classList.toggle('open', show);
        }

        function setSpacingMode(mode) {
            spacingMode = mode;
            renderTimeline();
        }

        window.onload = renderTimeline;
    </script>
</body>
</html>

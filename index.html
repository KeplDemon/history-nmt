<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPrep NMT | Інтерактивна платформа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #151c2c;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26334d;
      --bubble-bg: #151c2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .header-container {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.1rem; }
    .logo span { color: var(--accent-gold); }

    .search-box input {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.85rem; outline: none;
    }

    .timeline-container {
      position: relative;
      width: 100%;
      margin-top: 1rem;
    }

    .timeline-scroll-area {
      display: flex;
      overflow-x: auto;
      position: relative;
      padding: 5rem 2rem 5rem 1rem;
      width: 100%;
      cursor: grab;
      user-select: none;
      scrollbar-width: none;
    }
    .timeline-scroll-area::-webkit-scrollbar { display: none; }
    .timeline-scroll-area:active { cursor: grabbing; }

    .timeline-ticks {
      display: flex;
      position: relative;
      z-index: 2;
      align-items: center;
      width: max-content;
      padding-right: 4rem;
    }

    .timeline-axis-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--accent-gold);
      z-index: 1;
      transform: translateY(-50%);
    }

    .fixed-arrow-right {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--accent-gold);
      z-index: 20;
      pointer-events: none;
      background: var(--bg-color);
      padding: 2px 5px;
    }

    /* Полоска процесса */
    .period-bar {
      position: absolute;
      height: 4px;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.15s, height 0.15s, opacity 0.2s;
      z-index: 4;
      opacity: 0.85;
    }
    .period-bar:hover { height: 7px; opacity: 1; transform: translateY(-1px); }

    .tick-wrapper { display: flex; align-items: center; position: relative; }

    .tick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 120px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .tick-mark {
      width: 14px;
      height: 14px;
      background: var(--accent-gold);
      border-radius: 50%;
      border: 3px solid var(--bg-color);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      transition: transform 0.2s, background-color 0.2s;
    }

    .tick-item:hover .tick-mark, 
    .tick-item.active .tick-mark {
      transform: translate(-50%, -50%) scale(1.4);
      background: var(--accent-blue);
    }

    .tick-item.highlighted .tick-mark {
      transform: translate(-50%, -50%) scale(1.4);
      background: #60a5fa !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 10px #60a5fa;
    }

    .tick-content-box {
      position: absolute;
      width: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pos-top { bottom: 22px; }
    .pos-bottom { top: 22px; }

    .tick-year { font-weight: 800; font-size: 0.82rem; color: var(--accent-gold); }
    .tick-short-title { font-size: 0.78rem; color: var(--text-muted); line-height: 1.2; margin-top: 2px; }

    .time-gap-break {
      width: 25px;
      height: 10px;
      position: relative;
      z-index: 3;
      background: radial-gradient(circle, var(--accent-gold) 25%, transparent 25%);
      background-size: 5px 5px;
      opacity: 0.5;
    }

    /* Floating Tooltip при наведении на отрезок */
    .floating-tooltip {
      position: fixed;
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      z-index: 2000;
      pointer-events: none;
      max-width: 260px;
    }
    .floating-tooltip-title { font-weight: 700; color: var(--accent-blue); margin-bottom: 3px; }

    /* Конспект */
    .speech-bubble {
      position: relative; 
      margin: 1.5rem 1rem; 
      background: var(--bubble-bg);
      border: 1px solid var(--accent-blue); 
      border-radius: 12px; 
      padding: 1.2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    .speech-bubble.hidden { display: none !important; }

    .bubble-close {
      position: absolute; top: 8px; right: 12px; font-size: 1.4rem;
      background: none; border: none; color: var(--text-muted); cursor: pointer;
    }

    .bubble-year { color: var(--accent-gold); font-weight: 900; font-size: 1.1rem; margin-bottom: 4px; display: inline-block; }
    .bubble-header h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
    
    .bubble-body { margin-top: 0.8rem; font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; }
    .bubble-body ul { margin-left: 1.2rem; margin-top: 0.4rem; }
    .bubble-body li { margin-bottom: 0.3rem; }

    /* Галерея картинок в конспекте */
    .images-gallery {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .img-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      flex: 0 0 auto;
      max-width: 220px;
    }
    .img-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
    }
    .img-caption {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
    }

    /* Аккордеоны */
    .accordion-container { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .accordion-item { border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); overflow: hidden; }
    .accordion-header { padding: 0.6rem 0.8rem; font-size: 0.82rem; font-weight: 700; color: var(--accent-gold); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .accordion-header::after { content: '▼'; font-size: 0.65rem; }
    .accordion-content { display: none; padding: 0.7rem 0.8rem; border-top: 1px solid var(--border-color); font-size: 0.82rem; line-height: 1.4; color: #cbd5e1; }
    .accordion-item.open .accordion-content { display: block; }

    .bubble-terms { 
      margin-top: 0.8rem; 
      padding-top: 0.6rem; 
      border-top: 1px dashed var(--border-color); 
      font-size: 0.82rem; 
      color: var(--accent-gold); 
    }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-row">
      <div class="logo">EduPrep <span>НМТ</span></div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Пошук року, події чи терміну...">
    </div>
  </header>

  <main>
    <div class="timeline-container">
      <div class="timeline-scroll-area" id="scroll-area">
        <div class="timeline-ticks" id="timeline-ticks">
          <div class="timeline-axis-line"></div>
        </div>
      </div>
      <div class="fixed-arrow-right">►</div>
    </div>

    <div id="details-bubble" class="speech-bubble hidden">
      <button class="bubble-close" id="close-bubble">&times;</button>
      <div class="bubble-header">
        <span class="bubble-year" id="det-year"></span>
        <h3 id="det-title"></h3>
      </div>
      <div class="bubble-body" id="det-body"></div>
      <div id="det-images" class="images-gallery"></div>
      <div class="accordion-container" id="det-accordions"></div>
      <div class="bubble-terms" id="det-terms"></div>
    </div>
  </main>

  <div id="floating-tooltip" class="floating-tooltip">
    <div id="tooltip-title" class="floating-tooltip-title"></div>
    <div id="tooltip-desc"></div>
  </div>

<script src="data.js"></script>
  <script>
    // 1. Конвертер римских цифр
    function toRoman(num) {
      var lookup = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1}, roman = '', i;
      for (i in lookup) { while (num >= lookup[i]) { roman += i; num -= lookup[i]; } }
      return roman;
    }

    // 2. Исправленный парсер дат (строго корректные века до н.э.)
    function parseDateToText(dateInput) {
      if (typeof dateInput === 'string') {
        var parts = dateInput.split('.');
        if (parts.length === 3) {
          var months = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
          return parseInt(parts[0], 10) + ' ' + months[parseInt(parts[1], 10) - 1] + ' ' + parts[2] + ' р.';
        }
        if (parts.length === 2) {
          var monthsCap = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
          return monthsCap[parseInt(parts[0], 10) - 1] + ' ' + parts[1] + ' р.';
        }
      }

      var num = parseFloat(dateInput);
      if (isNaN(num)) return dateInput;

      if (num < 0) {
        var abs = Math.abs(num);
        if (abs >= 10000) return Math.round(abs / 1000) + ' тис. до н. е.';
        if (abs >= 1000) return (abs / 1000).toFixed(1).replace('.0','') + ' тис. до н. е.';
        var century = Math.ceil(abs / 100);
        return toRoman(century) + ' ст. до н. е.';
      } else {
        return num + ' р.';
      }
    }

    function getNumericYear(dateInput) {
      if (typeof dateInput === 'number') return dateInput;
      if (typeof dateInput === 'string') {
        var parts = dateInput.split('.');
        if (parts.length === 3) return parseFloat(parts[2]) + (parseFloat(parts[1])/12);
        if (parts.length === 2) return parseFloat(parts[1]) + (parseFloat(parts[0])/12);
        return parseFloat(dateInput) || 0;
      }
      return 0;
    }

    // Генератор случайных/гармоничных цветов
    function getRandomColor(index) {
      var palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
      if (index < palette.length) return palette[index];
      return 'hsl(' + (index * 137.5 % 360) + ', 70%, 50%)';
    }

    var currentActiveId = null;

    function renderTimeline(data) {
      var container = document.getElementById('timeline-ticks');
      if (!container) return;
      container.innerHTML = '<div class="timeline-axis-line"></div>';

      // Сортировка строго по хронологии
      data.sort(function(a, b) { return getNumericYear(a.date) - getNumericYear(b.date); });

      // Определение положения точек (верх/низ) на основе периодов
      var pointPositions = {};
      if (typeof periodsData !== 'undefined') {
        periodsData.forEach(function(p, pIdx) {
          var isTopPeriod = (pIdx % 2 === 0); // Чередуем периоды: четные СВЕРХУ, нечетные СНИЗУ
          
          var startYr = getNumericYear(data.find(e => e.id === p.startEventId)?.date);
          var endYr = getNumericYear(data.find(e => e.id === p.endEventId)?.date);

          data.forEach(function(item) {
            var itemYr = getNumericYear(item.date);
            if (itemYr >= startYr && itemYr <= endYr) {
              // Если период СВЕРХУ -> текст и точка уходят ВНИЗ (pos-bottom)
              // Если период СНИЗУ -> текст уходит ВВЕРХ (pos-top)
              pointPositions[item.id] = isTopPeriod ? 'pos-bottom' : 'pos-top';
            }
          });
        });
      }

      var tickElements = {};

      for (var i = 0; i < data.length; i++) {
        (function(item, index) {
          var displayYear = item.yearText || parseDateToText(item.date);
          var wrapper = document.createElement('div');
          wrapper.className = 'tick-wrapper';

          // Фиксированное адекватное расстояние между точками!
          var gap = 110; 
          if (index < data.length - 1) {
            var diff = Math.abs(getNumericYear(data[index+1].date) - getNumericYear(item.date));
            if (diff > 2000) gap = 170; // Скачок во времени для разрыва
          }

          var tick = document.createElement('div');
          tick.className = 'tick-item' + (currentActiveId === item.id ? ' active' : '');
          tick.style.marginRight = gap + 'px';

          // Если точка внутри периода — берем привязку периода, иначе чередуем
          var positionClass = pointPositions[item.id] || (index % 2 === 0 ? 'pos-top' : 'pos-bottom');

          tick.innerHTML = 
            '<div class="tick-mark"></div>' +
            '<div class="tick-content-box ' + positionClass + '">' +
              '<div class="tick-year">' + displayYear + '</div>' +
              '<div class="tick-short-title">' + item.title + '</div>' +
            '</div>';
          
          tick.onclick = function() {
            if (currentActiveId === item.id) {
              closeBubble();
            } else {
              document.querySelectorAll('.tick-item').forEach(function(el) { el.classList.remove('active'); });
              tick.classList.add('active');
              currentActiveId = item.id;
              openBubble(item, displayYear);
            }
          };

          wrapper.appendChild(tick);

          if (gap >= 170 && index < data.length - 1) {
            var gapMark = document.createElement('div');
            gapMark.className = 'time-gap-break';
            gapMark.style.marginRight = gap + 'px';
            wrapper.appendChild(gapMark);
          }

          container.appendChild(wrapper);
          tickElements[item.id] = tick;
        })(data[i], i);
      }

      setTimeout(function() { renderPeriods(tickElements); }, 50);
    }

    function renderPeriods(tickElements) {
      if (typeof periodsData === 'undefined') return;
      var container = document.getElementById('timeline-ticks');
      var tooltip = document.getElementById('floating-tooltip');

      periodsData.forEach(function(period, index) {
        var startEl = tickElements[period.startEventId];
        var endEl = tickElements[period.endEventId];

        if (startEl && endEl) {
          var startRect = startEl.getBoundingClientRect();
          var endRect = endEl.getBoundingClientRect();
          var containerRect = container.getBoundingClientRect();

          var leftPos = (startRect.left + startRect.width / 2) - containerRect.left;
          var rightPos = (endRect.left + endRect.width / 2) - containerRect.left;

          var bar = document.createElement('div');
          bar.className = 'period-bar';
          bar.style.left = leftPos + 'px';
          bar.style.width = (rightPos - leftPos) + 'px';
          
          // Расположение полосы: чётные СВЕРХУ линии, нечётные СНИЗУ линии
          var isTop = (index % 2 === 0);
          if (isTop) {
            bar.style.top = 'calc(50% - 16px)';
          } else {
            bar.style.top = 'calc(50% + 12px)';
          }

          bar.style.backgroundColor = period.color || getRandomColor(index);

          function showTooltip(e) {
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top = (e.clientY + 12) + 'px';
            document.getElementById('tooltip-title').innerText = period.title;
            document.getElementById('tooltip-desc').innerText = period.description;

            startEl.classList.add('highlighted');
            endEl.classList.add('highlighted');
          }

          function hideTooltip() {
            tooltip.style.display = 'none';
            startEl.classList.remove('highlighted');
            endEl.classList.remove('highlighted');
          }

          bar.onmousemove = showTooltip;
          bar.onmouseleave = hideTooltip;
          bar.onclick = function(e) {
            e.stopPropagation();
            showTooltip(e);
          };

          container.appendChild(bar);
        }
      });
    }

    function openBubble(item, displayYear) {
      var bubble = document.getElementById('details-bubble');
      document.getElementById('det-year').innerText = displayYear;
      document.getElementById('det-title').innerText = item.title;
      document.getElementById('det-body').innerHTML = item.details.fullText;
      
      var imgContainer = document.getElementById('det-images');
      imgContainer.innerHTML = '';
      if (item.images && item.images.length > 0) {
        item.images.forEach(function(img) {
          var card = document.createElement('div');
          card.className = 'img-card';
          card.innerHTML = '<img src="' + img.url + '" alt="НМТ"><div class="img-caption">' + img.caption + '</div>';
          imgContainer.appendChild(card);
        });
        imgContainer.style.display = 'flex';
      } else {
        imgContainer.style.display = 'none';
      }

      var accContainer = document.getElementById('det-accordions');
      accContainer.innerHTML = '';
      if (item.details.accordions && item.details.accordions.length > 0) {
        item.details.accordions.forEach(function(acc) {
          var accItem = document.createElement('div');
          accItem.className = 'accordion-item';
          accItem.innerHTML = 
            '<div class="accordion-header">' + acc.title + '</div>' +
            '<div class="accordion-content">' + acc.content + '</div>';
          
          accItem.querySelector('.accordion-header').onclick = function() {
            accItem.classList.toggle('open');
          };
          accContainer.appendChild(accItem);
        });
      }

      var termsBox = document.getElementById('det-terms');
      if (item.details.terms && item.details.terms.length > 0) {
        termsBox.innerHTML = '<b>Терміни НМТ:</b> ' + item.details.terms.join(' • ');
        termsBox.style.display = 'block';
      } else {
        termsBox.style.display = 'none';
      }
      
      bubble.classList.remove('hidden');
    }

    function closeBubble() {
      document.getElementById('details-bubble').classList.add('hidden');
      document.querySelectorAll('.tick-item').forEach(function(el) { el.classList.remove('active'); });
      currentActiveId = null;
    }

    var scrollArea = document.getElementById('scroll-area');
    var isDown = false, startX, scrollLeft;

    scrollArea.addEventListener('mousedown', function(e) {
      isDown = true;
      startX = e.pageX - scrollArea.offsetLeft;
      scrollLeft = scrollArea.scrollLeft;
    });
    scrollArea.addEventListener('mouseleave', function() { isDown = false; });
    scrollArea.addEventListener('mouseup', function() { isDown = false; });
    scrollArea.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      var x = e.pageX - scrollArea.offsetLeft;
      scrollArea.scrollLeft = scrollLeft - (x - startX) * 1.5;
    });

    if (typeof eventsData !== 'undefined') {
      renderTimeline(eventsData);
    }

    document.getElementById('close-bubble').onclick = closeBubble;
  </script>
</body>
</html>

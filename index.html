<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPrep NMT | Інтерактивна платформа</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #151c2c;
      --accent-gold: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #26334d;
      --bubble-bg: #1e293b;
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --bubble-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-container {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.1rem; }
    .logo span { color: var(--accent-gold); }

    .settings-trigger-btn {
      background: none; border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-main); font-size: 0.85rem;
      font-weight: 600; cursor: pointer; padding: 0.3rem 0.6rem;
    }

    .nav-links { display: flex; gap: 0.4rem; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 600; padding: 0.3rem 0.6rem;
      border-radius: 6px; white-space: nowrap; cursor: pointer;
    }
    .nav-btn.active { color: var(--text-main); background-color: var(--border-color); }

    .search-box input {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 0.5rem 0.8rem; border-radius: 8px; font-size: 0.85rem; outline: none;
    }

    /* Главный контейнер таймлайна */
    .timeline-container {
      position: relative;
      width: 100%;
      margin-top: 1rem;
      overflow: hidden;
    }

    .timeline-scroll-area {
      display: flex;
      overflow-x: auto;
      position: relative;
      padding: 4.5rem 1rem 3rem 1rem;
      width: 100%;
      cursor: grab;
      user-select: none;
      scrollbar-width: none;
    }
    .timeline-scroll-area::-webkit-scrollbar { display: none; }
    .timeline-scroll-area:active { cursor: grabbing; }

    .timeline-ticks {
      display: flex;
      position: relative;
      z-index: 2;
      align-items: center;
      width: max-content;
      padding-right: 3rem;
    }

    /* Главная золотая линия цельная во всю длину контента */
    .timeline-axis-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background-color: var(--accent-gold);
      z-index: 1;
    }

    /* Стрелка в конце линии */
    .fixed-arrow-right {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: var(--accent-gold);
      z-index: 10;
      pointer-events: none;
    }

    /* Отрезки (Периоды / Процессы) над шкалой */
    .period-bar {
      position: absolute;
      top: -35px;
      height: 6px;
      border-radius: 4px;
      background-color: var(--accent-blue);
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
      z-index: 5;
    }

    .period-bar:hover {
      background-color: #60a5fa;
      transform: translateY(-2px);
    }

    .period-label {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-blue);
      white-space: nowrap;
      pointer-events: none;
    }

    /* Точки событий */
    .tick-wrapper { display: flex; align-items: center; position: relative; }

    .tick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 120px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .tick-mark {
      width: 16px;
      height: 16px;
      background: var(--accent-gold);
      border-radius: 50%;
      border: 3px solid var(--bg-color);
      margin: 6px 0;
      transition: transform 0.2s, background-color 0.2s;
    }

    .tick-item:hover .tick-mark, 
    .tick-item.active .tick-mark,
    .tick-item.highlighted .tick-mark {
      transform: scale(1.4);
      background: var(--accent-blue);
    }

    .tick-year { font-weight: 800; font-size: 0.85rem; color: var(--accent-gold); }
    .tick-short-title { font-size: 0.8rem; color: var(--text-muted); max-width: 130px; line-height: 1.2; }

    .time-gap-break {
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-gold); font-weight: bold; font-size: 1.2rem;
      padding: 0 10px; opacity: 0.6; user-select: none;
    }

    /* Всплывающее окошко-подсказка при наведении на отрезок */
    .floating-tooltip {
      position: fixed;
      display: none;
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      color: var(--text-main);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 2000;
      pointer-events: none;
      max-width: 250px;
    }

    .floating-tooltip-title { font-weight: 700; color: var(--accent-blue); margin-bottom: 2px; }

    /* Конспект под шкалой */
    .speech-bubble {
      position: relative; margin: 1rem; background: var(--bubble-bg);
      border: 2px solid var(--accent-blue); border-radius: 14px; padding: 1.4rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .speech-bubble.hidden { display: none !important; }

    .bubble-close {
      position: absolute; top: 10px; right: 14px; font-size: 1.6rem;
      background: none; border: none; color: var(--text-muted); cursor: pointer;
    }

    .bubble-year { color: var(--accent-gold); font-weight: 900; font-size: 1.15rem; margin-bottom: 4px; display: inline-block; }
    .bubble-header h3 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    .bubble-body { margin-top: 1rem; font-size: 0.95rem; line-height: 1.6; color: var(--text-main); }
    .bubble-terms { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); font-size: 0.85rem; color: var(--accent-gold); }

    .accordion-container { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .accordion-item { border: 1px solid var(--border-color); border-radius: 8px; background: var(--panel-bg); overflow: hidden; }
    .accordion-header { padding: 0.7rem 1rem; font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .accordion-header::after { content: '▼'; font-size: 0.7rem; }
    .accordion-content { display: none; padding: 0.8rem 1rem; border-top: 1px solid var(--border-color); background: var(--bg-color); font-size: 0.85rem; line-height: 1.4; }
    .accordion-item.open .accordion-content { display: block; }
  </style>
</head>
<body>

  <header class="header-container">
    <div class="top-row">
      <div class="logo">EduPrep <span>НМТ</span></div>
      <button id="open-settings-btn" class="settings-trigger-btn">⚙ Налаштування</button>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active">Історія України</button>
      <button class="nav-btn">Діячі</button>
      <button class="nav-btn">Пам'ятки</button>
      <button class="nav-btn">Шпори</button>
    </nav>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Пошук року, події чи терміну...">
    </div>
  </header>

  <main>
    <div class="timeline-container">
      <div class="timeline-scroll-area" id="scroll-area">
        <div class="timeline-ticks" id="timeline-ticks">
          <div class="timeline-axis-line"></div>
          </div>
        <div class="fixed-arrow-right">►</div>
      </div>
    </div>

    <div id="details-bubble" class="speech-bubble hidden">
      <button class="bubble-close" id="close-bubble">&times;</button>
      <div class="bubble-header">
        <span class="bubble-year" id="det-year"></span>
        <h3 id="det-title"></h3>
      </div>
      <div class="bubble-body" id="det-body"></div>
      <div class="accordion-container" id="det-accordions"></div>
      <div class="bubble-terms" id="det-terms"></div>
    </div>
  </main>

  <div id="floating-tooltip" class="floating-tooltip">
    <div id="tooltip-title" class="floating-tooltip-title"></div>
    <div id="tooltip-desc"></div>
  </div>

  <script>
    var currentActiveId = null;

    // События (Точки)
    var eventsData = [
      {
        id: "ev1",
        year: "1 млн р. тому",
        title: "Перші люди (Королеве)",
        gapType: "huge",
        details: {
          fullText: "<b>Палеоліт (Кам'яний вік).</b> Поява першої людини на території України.<br>Найдавніша стоянка — <b>с. Королеве (Закарпаття)</b>.",
          terms: ["Палеоліт", "Привласнювальне господарство", "Стоянка"]
        }
      },
      {
        id: "ev2_start",
        year: "IV тис. до н.е.",
        title: "Початок Трипільської культури",
        gapType: "huge",
        details: {
          fullText: "Початок розселення трипільців на землях України.",
          terms: ["Енеоліт", "Трипільці"]
        }
      },
      {
        id: "ev2_end",
        year: "III тис. до н.е.",
        title: "Занепад Трипільської культури",
        gapType: "medium",
        details: {
          fullText: "Занепад трипільських протоміст через кліматичні зміни та виснаження ґрунтів.",
          terms: ["Занепад", "Протоміста"]
        }
      },
      {
        id: "ev3",
        year: "VIII - VI ст. до н.е.",
        title: "Велика грецька колонізація",
        gapType: "medium",
        details: {
          fullText: "Заснування міст-держав: <b>Тіра, Ольвія, Херсонес, Пантікапей</b>.",
          terms: ["Метрополія", "Колонія"]
        }
      },
      {
        id: "ev4",
        year: "860 р.",
        title: "Похід Аскольда",
        gapType: "small",
        details: {
          fullText: "Перший морський похід на Візантію.",
          terms: ["Аскольд", "Царгород"]
        }
      }
    ];

    // Отрезки (Процессы / Периоды)
    var periodsData = [
      {
        id: "p_tripillia",
        title: "Трипільська культура",
        startEventId: "ev2_start",
        endEventId: "ev2_end",
        color: "#3b82f6",
        description: "Період енеоліту: мальована кераміка, протоміста, землеробство."
      }
    ];

    function renderTimeline(data) {
      var container = document.getElementById('timeline-ticks');
      if (!container) return;
      
      // Очищаем всё, сохраняя только линию оси
      container.innerHTML = '<div class="timeline-axis-line"></div>';

      if (!data || data.length === 0) {
        container.innerHTML += '<div style="padding: 20px; color: #94a3b8;">Подій не знайдено</div>';
        return;
      }

      var tickElements = {};

      for (var i = 0; i < data.length; i++) {
        (function(item) {
          var wrapper = document.createElement('div');
          wrapper.className = 'tick-wrapper';

          var marginValue = '40px';
          if (item.gapType === 'huge') marginValue = '140px';
          else if (item.gapType === 'medium') marginValue = '80px';
          else if (item.gapType === 'small') marginValue = '35px';

          var tick = document.createElement('div');
          tick.className = 'tick-item' + (currentActiveId === item.id ? ' active' : '');
          tick.style.marginRight = marginValue;
          tick.setAttribute('data-id', item.id);
          tick.innerHTML = 
            '<div class="tick-year">' + item.year + '</div>' +
            '<div class="tick-mark"></div>' +
            '<div class="tick-short-title">' + item.title + '</div>';
          
          tick.onclick = function() {
            if (currentActiveId === item.id) {
              closeBubble();
            } else {
              var allTicks = document.querySelectorAll('.tick-item');
              for (var j = 0; j < allTicks.length; j++) allTicks[j].classList.remove('active');
              tick.classList.add('active');
              currentActiveId = item.id;
              openBubble(item);
            }
          };

          wrapper.appendChild(tick);

          if (item.gapType === 'huge' && i < data.length - 1) {
            var gapMark = document.createElement('div');
            gapMark.className = 'time-gap-break';
            gapMark.innerText = '≈';
            gapMark.style.marginRight = marginValue;
            wrapper.appendChild(gapMark);
          }

          container.appendChild(wrapper);
          tickElements[item.id] = tick;
        })(data[i]);
      }

      // Отрисовка отрезков (Периодов) после рендера точек
      setTimeout(function() {
        renderPeriods(tickElements);
      }, 50);
    }

    function renderPeriods(tickElements) {
      var container = document.getElementById('timeline-ticks');
      var tooltip = document.getElementById('floating-tooltip');

      for (var i = 0; i < periodsData.length; i++) {
        var period = periodsData[i];
        var startEl = tickElements[period.startEventId];
        var endEl = tickElements[period.endEventId];

        if (startEl && endEl) {
          var startRect = startEl.getBoundingClientRect();
          var endRect = endEl.getBoundingClientRect();
          var containerRect = container.getBoundingClientRect();

          var leftPos = (startRect.left + startRect.width / 2) - containerRect.left;
          var rightPos = (endRect.left + endRect.width / 2) - containerRect.left;
          var width = rightPos - leftPos;

          var bar = document.createElement('div');
          bar.className = 'period-bar';
          bar.style.left = leftPos + 'px';
          bar.style.width = width + 'px';
          bar.style.backgroundColor = period.color;

          var label = document.createElement('div');
          label.className = 'period-label';
          label.innerText = period.title;
          bar.appendChild(label);

          // Наведение на отрезок
          (function(p, sEl, eEl) {
            bar.onmousemove = function(e) {
              tooltip.style.display = 'block';
              tooltip.style.left = (e.clientX + 15) + 'px';
              tooltip.style.top = (e.clientY + 15) + 'px';
              document.getElementById('tooltip-title').innerText = p.title;
              document.getElementById('tooltip-desc').innerText = p.description;

              sEl.classList.add('highlighted');
              eEl.classList.add('highlighted');
            };

            bar.onmouseleave = function() {
              tooltip.style.display = 'none';
              sEl.classList.remove('highlighted');
              eEl.classList.remove('highlighted');
            };
          })(period, startEl, endEl);

          container.appendChild(bar);
        }
      }
    }

    function openBubble(item) {
      var bubble = document.getElementById('details-bubble');
      document.getElementById('det-year').innerText = item.year;
      document.getElementById('det-title').innerText = item.title;
      document.getElementById('det-body').innerHTML = item.details.fullText;
      
      var termsBox = document.getElementById('det-terms');
      if (item.details.terms && item.details.terms.length > 0) {
        termsBox.innerHTML = '<b>Терміни НМТ:</b> ' + item.details.terms.join(' • ');
        termsBox.style.display = 'block';
      } else {
        termsBox.style.display = 'none';
      }
      
      bubble.classList.remove('hidden');
    }

    function closeBubble() {
      document.getElementById('details-bubble').classList.add('hidden');
      var allTicks = document.querySelectorAll('.tick-item');
      for (var j = 0; j < allTicks.length; j++) allTicks[j].classList.remove('active');
      currentActiveId = null;
    }

    // НАВИГАЦИЯ МЫШКОЙ (Скролл колесиком + Drag without false clicks)
    var scrollArea = document.getElementById('scroll-area');
    var isDown = false, startX, scrollLeft, dragDistance = 0;

    // 1. Прокрутка колесиком
    scrollArea.addEventListener('wheel', function(e) {
      if (e.deltaY !== 0) {
        e.preventDefault();
        scrollArea.scrollLeft += e.deltaY;
      }
    });

    // 2. Перетягивание мышкой
    scrollArea.addEventListener('mousedown', function(e) {
      isDown = true;
      dragDistance = 0;
      startX = e.pageX - scrollArea.offsetLeft;
      scrollLeft = scrollArea.scrollLeft;
    });

    scrollArea.addEventListener('mouseleave', function() { isDown = false; });
    scrollArea.addEventListener('mouseup', function() { isDown = false; });

    scrollArea.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      var x = e.pageX - scrollArea.offsetLeft;
      var walk = (x - startX) * 1.5;
      dragDistance = Math.abs(walk);
      if (dragDistance > 5) {
        e.preventDefault();
        scrollArea.scrollLeft = scrollLeft - walk;
      }
    });

    renderTimeline(eventsData);

    document.getElementById('close-bubble').onclick = closeBubble;
  </script>
</body>
</html>

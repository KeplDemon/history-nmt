<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>EduPrep НМТ — Вся історія</title>
    <style>
        :root {
            --bg-main: #0d0f12;
            --panel-bg: #151821;
            --card-bg: #1e2230;
            --card-border: #2d3448;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            /* Оранжевая палитра EduPrep */
            --orange-primary: #ff6b00;
            --orange-hover: #ff8533;
            --orange-glow: rgba(255, 107, 0, 0.4);
            --orange-light: rgba(255, 107, 0, 0.15);
            
            --timeline-axis: #374151;
        }

        /* Светлая тема */
        body.light-theme {
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --timeline-axis: #9ca3af;
        }

        /* Сепия тема */
        body.sepia-theme {
            --bg-main: #f4ecd8;
            --panel-bg: #e2d7be;
            --card-bg: #ebd2b9;
            --card-border: #d3c0a2;
            --text-main: #423223;
            --text-muted: #6e5944;
            --timeline-axis: #c8b69e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s;
        }

        /* --- ШАПКА --- */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 0.6rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .brand-logo span {
            color: var(--orange-primary);
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .search-input {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            width: 220px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--orange-primary);
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--orange-primary);
            color: var(--orange-primary);
        }

        /* --- РЕГУЛИРУЕМАЯ И ПОДНЯТАЯ ШКАЛА --- */
        .timeline-section {
            flex: 1;
            position: relative;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            cursor: grab;
            transform: rotateX(180deg); /* Скроллбар сверху */
            padding-top: 10px; /* Шкала поднята ближе к верху */
        }

        .timeline-section:active {
            cursor: grabbing;
        }

        .timeline-section::-webkit-scrollbar {
            height: 7px;
        }
        .timeline-section::-webkit-scrollbar-track {
            background: var(--panel-bg);
        }
        .timeline-section::-webkit-scrollbar-thumb {
            background: var(--orange-primary);
            border-radius: 4px;
        }

        .timeline-inner {
            position: relative;
            height: 100%;
            min-height: 280px;
            padding: 0 80px;
            transform: rotateX(180deg);
        }

        /* Ось времени */
        .timeline-axis-line {
            position: absolute;
            top: 130px; /* Высота посадки оси */
            left: 0;
            right: 0;
            height: 4px;
            background: var(--timeline-axis);
            border-radius: 2px;
            transform: translateY(-50%);
        }

        /* --- ПРИБИТЫЙ УКАЗАТЕЛЬ НАПРАВЛЕНИЯ СПРАВА --- */
        .pinned-pointer-arrow {
            position: fixed;
            right: 12px;
            top: calc(50px + 130px); /* Центровка по оси */
            transform: translateY(-50%);
            z-index: 40;
            color: var(--orange-primary);
            font-size: 1.4rem;
            filter: drop-shadow(0 0 6px var(--orange-glow));
            pointer-events: none;
        }

        /* --- ПЕРИОДЫ (ЧЕРЕДОВАНИЕ СВЕРХУ И СНИЗУ) --- */
        .period-bar-item {
            position: absolute;
            height: 8px;
            border-radius: 4px;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }

        .period-bar-item.pos-top {
            top: 108px; /* Над осью */
        }

        .period-bar-item.pos-bottom {
            top: 144px; /* Под осью */
        }

        .period-bar-item:hover {
            transform: scaleY(1.4);
            filter: brightness(1.2);
        }

        /* --- ТОЧКИ СОБЫТИЙ С ТОЧНЫМ ЦЕНТРИРОВАНИЕМ --- */
        .timeline-node-item {
            position: absolute;
            top: 130px; /* По центру оси */
            transform: translate(-50%, -50%);
            z-index: 5;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .node-dot-circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--orange-primary);
            border: 3px solid var(--bg-main);
            box-shadow: 0 0 8px var(--orange-glow);
            transition: all 0.2s;
        }

        .timeline-node-item:hover .node-dot-circle,
        .timeline-node-item.active .node-dot-circle {
            background-color: #ffffff;
            border-color: var(--orange-primary);
            transform: scale(1.3);
            box-shadow: 0 0 14px var(--orange-primary);
        }

        .node-caption-box {
            position: absolute;
            width: 140px;
            text-align: center;
            pointer-events: none;
        }

        .timeline-node-item.pos-top .node-caption-box {
            bottom: 22px;
        }

        .timeline-node-item.pos-bottom .node-caption-box {
            top: 22px;
        }

        .node-date-lbl {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--orange-primary);
        }

        .node-title-lbl {
            font-size: 0.76rem;
            color: var(--text-main);
            line-height: 1.2;
            font-weight: 500;
            margin-top: 2px;
        }

        /* --- ПОДСКАЗКА ПЕРИОДА ПРИ НАВЕДЕНИИ --- */
        .period-tooltip {
            position: fixed;
            display: none;
            z-index: 100;
            background: var(--card-bg);
            border: 1px solid var(--orange-primary);
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            pointer-events: none;
            max-width: 260px;
        }

        .period-tooltip-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--orange-primary);
        }

        .period-tooltip-desc {
            font-size: 0.76rem;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* --- ПЛАВАЮЩЕЕ ПЕРЕТАСКИВАЕМОЕ И РЕГУЛИРУЕМОЕ ОКНО КОНСПЕКТА --- */
        .floating-window {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 420px;
            min-width: 320px;
            min-height: 220px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 3px solid var(--orange-primary);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            z-index: 90;
            display: none;
            flex-direction: column;
            resize: both; /* Можно растягивать за угол */
            overflow: hidden;
        }

        .floating-window.open {
            display: flex;
        }

        .window-header {
            padding: 0.8rem 1.1rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move; /* Курсор для перетаскивания */
            user-select: none;
        }

        .window-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .window-date {
            font-size: 0.82rem;
            color: var(--orange-primary);
            font-weight: 700;
        }

        .window-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 0.3rem;
        }

        .window-close-btn:hover {
            color: var(--orange-primary);
        }

        .window-body {
            padding: 1.1rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Контент модалки */
        .note-images {
            display: flex;
            gap: 10px;
            margin-bottom: 0.8rem;
            overflow-x: auto;
        }

        .note-img {
            max-height: 180px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            object-fit: contain;
        }

        .note-text {
            line-height: 1.55;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .note-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 0.8rem;
        }

        .tag-badge {
            background: var(--orange-light);
            border: 1px solid var(--orange-primary);
            color: var(--orange-primary);
            padding: 0.15rem 0.5rem;
            border-radius: 15px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        details {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            margin-bottom: 6px;
        }

        summary {
            padding: 0.6rem 0.8rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .acc-content {
            padding: 0.7rem 0.8rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.82rem;
            line-height: 1.45;
        }

        /* МОДАЛКА НАСТРОЕК */
        .settings-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .settings-backdrop.open {
            display: flex;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.4rem;
            width: 360px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.88rem;
        }

        select {
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">
            <span>EduPrep</span> НМТ
        </div>
        <div class="header-tools">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук дати або події..." oninput="handleSearch()">
            <button class="icon-btn" onclick="toggleSettingsModal(true)">⚙️ Налаштування</button>
        </div>
    </header>

    <div class="pinned-pointer-arrow">▶</div>

    <div class="period-tooltip" id="periodTooltip">
        <div class="period-tooltip-title" id="ttTitle"></div>
        <div class="period-tooltip-desc" id="ttDesc"></div>
    </div>

    <div class="timeline-section" id="timelineViewport">
        <div class="timeline-inner" id="timelineInner">
            <div class="timeline-axis-line" id="timelineAxis"></div>
            <div id="periodsLayer"></div>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <div class="floating-window" id="floatingWindow">
        <div class="window-header" id="windowHeader">
            <div>
                <div class="window-title" id="wTitle">Заголовок</div>
                <div class="window-date" id="wDate">Дата</div>
            </div>
            <button class="window-close-btn" onclick="closeWindow()">✕</button>
        </div>
        <div class="window-body" id="wBody">
            </div>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop">
        <div class="settings-card">
            <h3 style="margin-bottom: 1.2rem; color: var(--orange-primary);">⚙️ Налаштування</h3>
            
            <div class="form-row">
                <span>Тема оформлення:</span>
                <select id="themeSelect" onchange="setTheme(this.value)">
                    <option value="dark">Темна (Графіт)</option>
                    <option value="light">Світла</option>
                    <option value="sepia">Сепія</option>
                </select>
            </div>

            <div class="form-row">
                <span>Відстань між датами:</span>
                <select id="spacingSelect" onchange="setSpacingMode(this.value)">
                    <option value="dynamic" selected>Динамічна (базова)</option>
                    <option value="fixed">Рівномірна (широка)</option>
                </select>
            </div>

            <button class="icon-btn" style="width: 100%; text-align: center; margin-top: 0.5rem;" onclick="toggleSettingsModal(false)">Закрити</button>
        </div>
    </div>

    <script src="data.js"></script>

    <script>
        const MONTHS_UA = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
        const COLOR_PALETTE = ["#ff6b00", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#f59e0b", "#06b6d4"];

        let activeNodeId = null;
        let spacingMode = 'dynamic'; // Динамическая по умолчанию!

        function parseToYearVal(raw) {
            if (typeof raw === 'number') return raw;
            if (!raw) return 0;
            const str = String(raw).trim();
            const parts = str.split('.');

            if (parts.length === 3) return parseFloat(parts[2]) + (parseFloat(parts[1]) / 12);
            if (parts.length === 2) return parseFloat(parts[1]) + (parseFloat(parts[0]) / 12);
            return parseFloat(str) || 0;
        }

        function formatYearText(item) {
            if (item.yearText) return item.yearText;
            const raw = item.date;

            if (typeof raw === 'number') {
                if (raw < 0) {
                    const abs = Math.abs(raw);
                    if (abs >= 1000000) return `${abs / 1000000} млн р. тому`;
                    if (abs >= 1000) return `${abs / 1000} тис. р. тому`;
                    return `${abs} р. до н.е.`;
                }
                return `${raw} р.`;
            }

            const str = String(raw).trim();
            const parts = str.split('.');

            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = MONTHS_UA[parseInt(parts[1], 10) - 1] || '';
                return `${day} ${month} ${parts[2]} р.`;
            } else if (parts.length === 2) {
                const month = MONTHS_UA[parseInt(parts[0], 10) - 1] || '';
                return `${month} ${parts[1]} р.`;
            }
            return `${str} р.`;
        }

        // РЕНДЕР ШКАЛЫ
        function renderTimeline() {
            if (typeof eventsData === 'undefined') return;

            const inner = document.getElementById('timelineInner');
            const nodesLayer = document.getElementById('nodesLayer');
            const periodsLayer = document.getElementById('periodsLayer');
            const axisLine = document.getElementById('timelineAxis');

            nodesLayer.innerHTML = '';
            periodsLayer.innerHTML = '';

            const sorted = [...eventsData].sort((a, b) => parseToYearVal(a.date) - parseToYearVal(b.date));

            const positions = {};
            let maxPos = 0;
            const gap = 180;

            sorted.forEach((ev, idx) => {
                let posX = 0;
                if (spacingMode === 'fixed') {
                    posX = 80 + idx * gap;
                } else {
                    if (idx === 0) posX = 80;
                    else {
                        const prevYear = parseToYearVal(sorted[idx - 1].date);
                        const currYear = parseToYearVal(ev.date);
                        const diff = Math.max(1, currYear - prevYear);
                        const step = Math.min(380, Math.max(120, Math.log10(diff + 1) * 90));
                        posX = positions[sorted[idx - 1].id] + step;
                    }
                }
                positions[ev.id] = posX;
                maxPos = posX + 180;
            });

            inner.style.width = `${maxPos}px`;
            axisLine.style.width = `${maxPos}px`;

            const periodsRanges = [];
            
            // 1. Отрисовка периодов с ЧЕРЕДОВАНИЕМ (Сверху / Снизу)
            if (typeof periodsData !== 'undefined') {
                periodsData.forEach((p, index) => {
                    const startX = positions[p.startEventId];
                    const endX = positions[p.endEventId];

                    if (startX !== undefined && endX !== undefined) {
                        const color = p.color || COLOR_PALETTE[index % COLOR_PALETTE.length];
                        const isTopPeriod = (index % 2 === 0); // Чередуем периоды!
                        
                        const bar = document.createElement('div');
                        bar.className = `period-bar-item ${isTopPeriod ? 'pos-top' : 'pos-bottom'}`;
                        bar.style.left = `${startX}px`;
                        bar.style.width = `${endX - startX}px`;
                        bar.style.backgroundColor = color;

                        bar.onmousemove = (e) => showPeriodTooltip(e, p);
                        bar.onmouseleave = hidePeriodTooltip;

                        periodsLayer.appendChild(bar);
                        periodsRanges.push({ startX, endX, isTop: isTopPeriod });
                    }
                });
            }

            // 2. Отрисовка точек
            sorted.forEach((ev, idx) => {
                const posX = positions[ev.id];
                let isTop = (idx % 2 === 0);

                // Если точка совпадает с периодом — уводим текст на противоположную сторону
                const overlap = periodsRanges.find(r => posX >= r.startX && posX <= r.endX);
                if (overlap) {
                    isTop = !overlap.isTop;
                }

                const node = document.createElement('div');
                node.className = `timeline-node-item ${isTop ? 'pos-top' : 'pos-bottom'} ${activeNodeId === ev.id ? 'active' : ''}`;
                node.id = `node-${ev.id}`;
                node.style.left = `${posX}px`;

                node.innerHTML = `
                    <div class="node-dot-circle"></div>
                    <div class="node-caption-box">
                        <div class="node-date-lbl">${formatYearText(ev)}</div>
                        <div class="node-title-lbl">${ev.title}</div>
                    </div>
                `;

                node.onclick = () => openWindow(ev);
                nodesLayer.appendChild(node);
            });
        }

        function showPeriodTooltip(e, p) {
            const tt = document.getElementById('periodTooltip');
            document.getElementById('ttTitle').innerText = p.title;
            document.getElementById('ttDesc').innerText = p.description || '';

            tt.style.display = 'block';
            tt.style.left = `${e.clientX + 12}px`;
            tt.style.top = `${e.clientY + 12}px`;
        }

        function hidePeriodTooltip() {
            document.getElementById('periodTooltip').style.display = 'none';
        }

        // ОТКРЫТИЕ ПЛАВАЮЩЕГО ОКНА
        function openWindow(ev) {
            activeNodeId = ev.id;
            document.querySelectorAll('.timeline-node-item').forEach(n => n.classList.remove('active'));
            const activeEl = document.getElementById(`node-${ev.id}`);
            if (activeEl) activeEl.classList.add('active');

            document.getElementById('wTitle').innerText = ev.title;
            document.getElementById('wDate').innerText = formatYearText(ev);

            const body = document.getElementById('wBody');
            body.innerHTML = '';

            if (ev.images && ev.images.length > 0) {
                const imgsDiv = document.createElement('div');
                imgsDiv.className = 'note-images';
                ev.images.forEach(img => {
                    imgsDiv.innerHTML += `<img src="${img.url}" class="note-img" title="${img.caption || ''}">`;
                });
                body.appendChild(imgsDiv);
            }

            if (ev.details && ev.details.fullText) {
                const txt = document.createElement('div');
                txt.className = 'note-text';
                txt.innerHTML = ev.details.fullText;
                body.appendChild(txt);
            }

            if (ev.details && ev.details.terms && ev.details.terms.length > 0) {
                const tags = document.createElement('div');
                tags.className = 'note-tags';
                ev.details.terms.forEach(t => {
                    tags.innerHTML += `<span class="tag-badge"># ${t}</span>`;
                });
                body.appendChild(tags);
            }

            if (ev.details && ev.details.accordions && ev.details.accordions.length > 0) {
                ev.details.accordions.forEach(acc => {
                    const det = document.createElement('details');
                    det.innerHTML = `
                        <summary>${acc.title}</summary>
                        <div class="acc-content">${acc.content}</div>
                    `;
                    body.appendChild(det);
                });
            }

            document.getElementById('floatingWindow').classList.add('open');
        }

        function closeWindow() {
            document.getElementById('floatingWindow').classList.remove('open');
            document.querySelectorAll('.timeline-node-item').forEach(n => n.classList.remove('active'));
            activeNodeId = null;
        }

        // ПЕРЕТАСКИВАНИЕ И СВАЙПЫ (МЫШЬ + ТАЧСКРИН ДЛЯ ТЕЛЕФОНОВ)
        const viewport = document.getElementById('timelineViewport');
        let isMouseDown = false;
        let startX, scrollLeft;

        // Мышь
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.timeline-node-item') || e.target.closest('.period-bar-item')) return;
            isMouseDown = true;
            startX = e.pageX - viewport.offsetLeft;
            scrollLeft = viewport.scrollLeft;
        });
        viewport.addEventListener('mouseleave', () => isMouseDown = false);
        viewport.addEventListener('mouseup', () => isMouseDown = false);
        viewport.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            e.preventDefault();
            const x = e.pageX - viewport.offsetLeft;
            viewport.scrollLeft = scrollLeft - (x - startX) * 1.5;
        });

        // Тач для телефонов
        viewport.addEventListener('touchstart', (e) => {
            startX = e.touches[0].pageX - viewport.offsetLeft;
            scrollLeft = viewport.scrollLeft;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            const x = e.touches[0].pageX - viewport.offsetLeft;
            viewport.scrollLeft = scrollLeft - (x - startX) * 1.5;
        }, { passive: true });

        // Колесико
        viewport.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                viewport.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        // Стрелки клавиатуры
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') viewport.scrollLeft += 120;
            if (e.key === 'ArrowLeft') viewport.scrollLeft -= 120;
        });

        // DRAG ДЛЯ ПЛАВАЮЩЕГО ОКНА
        const windowEl = document.getElementById('floatingWindow');
        const headerEl = document.getElementById('windowHeader');
        let isDraggingWindow = false, winOffsetX = 0, winOffsetY = 0;

        headerEl.addEventListener('mousedown', (e) => {
            isDraggingWindow = true;
            winOffsetX = e.clientX - windowEl.offsetLeft;
            winOffsetY = e.clientY - windowEl.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDraggingWindow) return;
            windowEl.style.left = `${e.clientX - winOffsetX}px`;
            windowEl.style.top = `${e.clientY - winOffsetY}px`;
            windowEl.style.transform = 'none'; // Снимаем центрирование после первого перемещения
        });

        document.addEventListener('mouseup', () => isDraggingWindow = false);

        // ПОИСК И НАСТРОЙКИ
        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!q) return;

            const match = eventsData.find(ev => 
                ev.title.toLowerCase().includes(q) || 
                (ev.yearText && ev.yearText.toLowerCase().includes(q)) ||
                String(ev.date).includes(q)
            );

            if (match) {
                const el = document.getElementById(`node-${match.id}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    openWindow(match);
                }
            }
        }

        function toggleSettingsModal(show) {
            document.getElementById('settingsBackdrop').classList.toggle('open', show);
        }

        function setTheme(theme) {
            document.body.className = theme === 'dark' ? '' : `${theme}-theme`;
        }

        function setSpacingMode(mode) {
            spacingMode = mode;
            renderTimeline();
        }

        window.onload = renderTimeline;
    </script>
</body>
</html>
